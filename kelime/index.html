erse** the effects of early stage cognitive decline.","extr":"Araştırmacılar, belirli yaşam tarzı değişikliklerinin erken evre bilişsel gerilemenin etkilerini **tersineçevirip** çeviremeyeceğini araştırıyor."},{"n":173,"w":"rotate","tr":"döndürmek, rotasyon yapmak, sırayla değiştirmek","syn":"turn, spin, alternate","ex":"To prevent soil depletion and maintain biodiversity, sustainable agriculture practices often involve **rotating** crops according to a carefully planned cycle.","extr":"Toprak tükenmesini önlemek ve biyolojik çeşitliliği korumak için sürdürülebilir tarım uygulamaları, genellikle ürünleri dikkatle planlanmış bir döngüye göre **döndürmeyi** içerir."},{"n":174,"w":"sacrifice","tr":"feda etmek, kurban etmek, gözden çıkarmak","syn":"give up","ex":"Some farmers must **sacrifice** short-term profits to invest in sustainable practices that protect soil health for future generations.","extr":"Bazı çiftçiler, gelecek nesiller için toprak sağlığını koruyan sürdürülebilir uygulamalara yatırım yapmak adına kısa vadeli kârları **feda etmek** zorundadır."},{"n":175,"w":"scatter","tr":"dağıtmak, saçmak, yaymak","syn":"disperse, spread","ex":"The collapse of the empire caused its cultural artifacts to be **scattered** across museums and private collections worldwide, complicating efforts at historical reconstruction.","extr":"İmparatorluğun çöküşü, kültürel eserlerinin dünya genelindeki müzeler ve özel koleksiyonlara **dağılmasına** neden oldu ve bu da tarihsel yeniden inşa çabalarını zorlaştırdı."},{"n":176,"w":"seize","tr":"ele geçirmek, zapt etmek, (fırsat) değerlendirmek","syn":"capture, take hold of, grab","ex":"The research team decided to **seize** the opportunity to collaborate with a Nobel laureate visiting their university.","extr":"Araştırma ekibi, üniversitelerini ziyaret eden Nobel ödüllü bir bilim insanıyla işbirliği yapma fırsatını **değerlendirmeye** karar verdi."},{"n":177,"w":"separate","tr":"ayırmak, bölmek, ayrılmak","syn":"divide, segregate, part","ex":"A fundamental tenet of the scientific method is the attempt to **separate** observable facts from the researcher's personal biases or expectations.","extr":"Bilimsel yöntemin temel bir ilkesi, gözlemlenebilir gerçekleri araştırmacının kişisel önyargılarından veya beklentilerinden **ayırmaya** çalışmaktır."},{"n":178,"w":"settle","tr":"yerleşmek; çözmek (anlaşmazlık); ödemek (borç); yerine oturmak","syn":"resolve; colonize; pay","ex":"After years of migration, the tribe **settled** in a fertile valley near the river.","extr":"Yıllarca süren göçün ardından kabile, nehir yakınındaki verimli bir vadiye **yerleşti**."},{"n":179,"w":"signify","tr":"İfade etmek, anlamına gelmek, belirtmek","syn":"mean, denote, indicate","ex":"Dark green leaves on a plant usually **signify** good health and adequate nutrient intake.","extr":"Bir bitkideki koyu yeşil yapraklar genellikle iyi sağlık ve yeterli besin alımını **işaret eder**."},{"n":180,"w":"simulate","tr":"benzetim yapmak, simüle etmek, taklit etmek","syn":"imitate, replicate, model","ex":"Climate scientists use supercomputers to **simulate** future scenarios based on different greenhouse gas emission pathways.","extr":"İklim bilimcileri, farklı sera gazı emisyon yollarına dayanan gelecek senaryolarını **simüle etmek** için süper bilgisayarlar kullanır."},{"n":181,"w":"spark","tr":"kıvılcım çıkarmak, tetiklemek, harekete geçirmek","syn":"ignite, trigger, provoke","ex":"The discovery of microbial life on another planet would **spark** a revolution in our understanding of biology.","extr":"Başka bir gezegende mikrobiyal yaşam keşfedilmesi, biyoloji anlayışımızda bir devrimi **tetikleyebilir**."},{"n":182,"w":"spread","tr":"yayılmak, yaymak, dağılmak","syn":"disseminate, propagate, diffuse","ex":"Researchers are investigating how misinformation **spreads** on social media platforms during public health crises.","extr":"Araştırmacılar, halk sağlığı krizleri sırasında sosyal medya platformlarında yanlış bilgilerin nasıl **yayıldığını** araştırıyor."},{"n":183,"w":"store","tr":"depolamak, saklamak, biriktirmek","syn":"keep, save, accumulate","ex":"Advanced batteries that can efficiently **store** energy from intermittent renewable sources are critical for transitioning to a carbon-neutral power grid.","extr":"Aralıklı yenilenebilir kaynaklardan enerjiyi verimli bir şekilde **depolayabilen** gelişmiş piller, karbon nötr bir şebekeye geçiş için kritik öneme sahiptir."},{"n":184,"w":"strive","tr":"çabalamak, uğraşmak, gayret etmek","syn":"endeavor, struggle, aim","ex":"Ethical researchers must constantly **strive** to minimize harm and maximize beneficence in their studies involving human subjects.","extr":"Etik araştırmacılar, insan denekleri içeren çalışmalarında zararı en aza indirmek ve faydayı en üst düzeye çıkarmak için sürekli **çabalamalıdır**."},{"n":185,"w":"substitute","tr":"yerine koymak, ikame etmek","syn":"replace, supplant","ex":"While artificial sweeteners can **substitute for** sugar in terms of taste, their long-term health effects remain a subject of ongoing scientific debate.","extr":"Yapay tatlandırıcılar tat açısından şekerin **yerinialabilse** de, uzun vadeli sağlık etkileri halen devam eden bilimsel bir tartışma konusudur."},{"n":186,"w":"surpass","tr":"aşmak, geçmek, üstün gelmek","syn":"exceed, outdo, outperform","ex":"For the first time in history, renewable energy investments are projected to **surpass** those in fossil fuel infrastructure globally.","extr":"Tarihte ilk kez, yenilenebilir enerji yatırımlarının küresel olarak fosil yakıt altyapısına yapılan yatırımları **aşması** bekleniyor."},{"n":187,"w":"surrender","tr":"teslim olmak, bırakmak, vazgeçmek","syn":"give in, yield","ex":"Scientists must not **surrender** to pressure from funding sources that could compromise research integrity.","extr":"Bilim insanları, araştırma bütünlüğünü tehlikeye atabilecek fon kaynaklarından gelen baskıya **boyuneğmemelidir**."},{"n":188,"w":"suspend","tr":"askıya almak, geçici olarak durdurmak; asmak","syn":"halt, postpone; hang","ex":"Airline operations were temporarily **suspended** due to the volcanic ash cloud.","extr":"Havayolu operasyonları, volkanik kül bulutu nedeniyle geçici olarak **durduruldu**."},{"n":189,"w":"sustain","tr":"sürdürmek, devam ettirmek; desteklemek (yaşam)","syn":"maintain, support, uphold","ex":"The central question for policymakers is how to **sustain** economic growth while simultaneously reducing inequality and environmental degradation.","extr":"Politika yapıcılar için temel soru, eşitsizliği ve çevresel bozulmayı azaltırken aynı zamanda ekonomik büyümeyi nasıl **sürdürecekleridir**."},{"n":190,"w":"tackle","tr":"üstesinden gelmeye çalışmak, ele almak, müdahale etmek","syn":"address, confront, deal with","ex":"A multilateral approach is essential to effectively **tackle** transnational challenges such as climate change, pandemics, and cybercrime.","extr":"İklim değişikliği, pandemiler ve siber suçlar gibi sınır ötesi zorlukları etkili bir şekilde **ele almak** için çok taraflı bir yaklaşım esastır."},{"n":191,"w":"target","tr":"hedeflemek, nişan almak, amaçlamak","syn":"aim at, focus on","ex":"The new drug specifically **targets** cancer cells without affecting healthy tissue.","extr":"Yeni ilaç, sağlıklı dokuya zarar vermeden özellikle kanser hücrelerini **hedef alıyor**."},{"n":192,"w":"transmit","tr":"İletmek, aktarmak, bulaştırmak (hastalık), yayınlamak","syn":"convey, transfer; broadcast","ex":"Cultural values are primarily **transmitted** through language, rituals, and shared narratives across generations.","extr":"Kültürel değerler öncelikle dil, ritüeller ve nesiller arası paylaşılan anlatılar yoluyla **aktarılır**."},{"n":193,"w":"trigger","tr":"tetiklemek, başlatmak, harekete geçirmek","syn":"set off, initiate, spark","ex":"A seemingly minor diplomatic incident can **trigger** a cascade of events leading to a major international crisis.","extr":"Görünüşte önemsiz bir diplomatik olay, büyük bir uluslararası krize yol açan bir dizi olayı **tetikleyebilir**."},{"n":194,"w":"undermine","tr":"zayıflatmak, baltalamak, temelini sarsmak","syn":"weaken, erode","ex":"Spreading false information about vaccines can **undermine** public trust in healthcare institutions.","extr":"Aşılar hakkında yanlış bilgi yaymak, halkın sağlık kurumlarına olan güvenini **zayıflatabilir**."},{"n":195,"w":"utilise","tr":"kullanmak, faydalanmak, istifade etmek","syn":"use, employ, harness","ex":"Modern archaeology **utilises** non-invasive technologies like ground-penetrating radar to map sites without disturbing them.","extr":"Modern arkeoloji, alanları rahatsız etmeden haritalamak için yere nüfuz eden radar gibi invazif olmayan teknolojileri **kullanır**."},{"n":196,"w":"validate","tr":"doğrulamak, geçerli kılmak, onaylamak","syn":"confirm, verify, authenticate","ex":"Peer review is a crucial process used to **validate** research findings before they are published.","extr":"Akran değerlendirmesi, araştırma bulguları yayınlanmadan önce onları **doğrulamak** için kullanılan çok önemli bir süreçtir."},{"n":197,"w":"violate","tr":"ihlal etmek, çiğnemek, bozmak","syn":"break, breach, infringe","ex":"The company was fined for **violating** environmental regulations by dumping waste into the river.","extr":"Şirket, atıkları nehre boşaltarak çevre düzenlemelerini **ihlal** ettiği için para cezasına çarptırıldı."},{"n":198,"w":"warrant","tr":"haklı çıkarmak, gerektirmek; (yasal) izin vermek","syn":"justify, merit; authorize","ex":"The severity of the side effects observed during the trial **warrants** further investigation before the drug can be approved.","extr":"Deney sırasında gözlemlenen yan etkilerin ciddiyeti, ilaç onaylanmadan önce daha fazla araştırma **yapılmasını gerektiriyor**."},{"n":199,"w":"withdraw","tr":"geri çekmek, çekilmek; (para) çekmek","syn":"retreat, pull out","ex":"The research team decided to **withdraw** their paper from the journal after discovering a critical error in their data.","extr":"Araştırma ekibi, verilerinde kritik bir hata keşfettikten sonra makalelerini dergiden **geriçekmeye** karar verdi."},{"n":200,"w":"yield","tr":"vermek (sonuç/ürün); boyun eğmek","syn":"produce; surrender, give up","ex":"The archaeological excavation **yielded** artifacts that challenged previous assumptions about the technological capabilities of the ancient civilization.","extr":"Arkeolojik kazı, antik uygarlığın teknolojik kapasiteleri hakkındaki önceki varsayımlara meydan okuyan eserler **verdi/ortaya çıkardı**."}];
const PHRASALS = [{"n":1,"w":"catch on","tr":"rağbet görmek","syn":"become popular","ex":"The idea of remote working **caught on** quickly during the pandemic.","extr":"Uzaktan çalışma fikri pandemi sırasında hızla **rağbet gördü**."},{"n":2,"w":"bring about","tr":"-e neden olmak","syn":"cause, lead to, give rise to","ex":"Industrialisation **brought about** profound changes in family structure.","extr":"Sanayileşme aile yapısında köklü değişikliklere **neden oldu**."},{"n":3,"w":"abide by","tr":"uymak, bağlı kalmak","syn":"conform to, obey, comply with","ex":"All member states are expected to **abide by** the terms of the treaty.","extr":"Tüm üye devletlerin antlaşmanın şartlarına **uyması** beklenir."},{"n":4,"w":"cope with","tr":"başa çıkmak, üstesinden gelmek","syn":"deal with, handle, overcome","ex":"Many students find it hard to **cope with** exam stress.","extr":"Pek çok öğrenci sınav stresiyle **başa çıkmakta** zorlanır."},{"n":5,"w":"blank out","tr":"unutmak, zihninden silmek","syn":"forget, blot out","ex":"Under pressure, the witness **blanked out** the details of the accident.","extr":"Baskı altında tanık kazanın ayrıntılarını **unuttu**."},{"n":6,"w":"call off","tr":"iptal etmek, durdurmak","syn":"cancel, stop","ex":"The match was **called off** because of the heavy storm.","extr":"Maç şiddetli fırtına nedeniyle **iptal edildi**."},{"n":7,"w":"come up with","tr":"çözüm fikri üretmek, bulmak","syn":"solve, suggest, develop","ex":"Engineers **came up with** an ingenious way to purify sea water.","extr":"Mühendisler deniz suyunu arıtmak için ustaca bir yöntem **buldu**."},{"n":8,"w":"break down","tr":"bozulmak","syn":"fall apart","ex":"Negotiations **broke down** after the two sides failed to agree on wages.","extr":"Taraflar ücretlerde anlaşamayınca müzakereler **bozuldu**."},{"n":9,"w":"convert into","tr":"dönüştürmek","syn":"transform into, turn into","ex":"Solar panels **convert** sunlight **into** electricity.","extr":"Güneş panelleri güneş ışığını elektriğe **dönüştürür**."},{"n":10,"w":"account for","tr":"1. açıklamak, 2. tekabül etmek","syn":"1. explain, 2. comprise, make up","ex":"Genetic factors may **account for** up to half of the differences in height.","extr":"Genetik faktörler boydaki farklılıkların yarısına kadarını **açıklayabilir**."},{"n":11,"w":"cut down on","tr":"azaltmak, indirmek","syn":"decrease, diminish, lessen","ex":"Doctors advised him to **cut down on** sugar and salt.","extr":"Doktorlar ona şeker ve tuzu **azaltmasını** tavsiye etti."},{"n":12,"w":"bear out","tr":"doğrulamak","syn":"confirm, verify, corroborate","ex":"Recent findings **bear out** the theory that sleep improves memory.","extr":"Son bulgular uykunun hafızayı güçlendirdiği teorisini **doğruluyor**."},{"n":13,"w":"carry out","tr":"yapmak, icra etmek","syn":"perform, do, fulfill, conduct","ex":"The researchers **carried out** a series of experiments on mice.","extr":"Araştırmacılar fareler üzerinde bir dizi deney **yaptı**."},{"n":14,"w":"break off","tr":"bitirmek, sona erdirmek","syn":"finish, end, terminate","ex":"The country **broke off** diplomatic relations with its neighbour.","extr":"Ülke komşusuyla diplomatik ilişkilerini **sona erdirdi**."},{"n":15,"w":"conjure up","tr":"zihinde canlandırmak, çağrıştırmak","syn":"evoke, summon, bring to mind","ex":"The smell of fresh bread **conjures up** memories of my childhood.","extr":"Taze ekmek kokusu çocukluk anılarımı **çağrıştırıyor**."},{"n":16,"w":"align with","tr":"uyum sağlamak, örtüşmek","syn":"be consistent with","ex":"The new policy does not **align with** the company's long-term goals.","extr":"Yeni politika şirketin uzun vadeli hedefleriyle **örtüşmüyor**."},{"n":17,"w":"bring up","tr":"1. büyütmek, 2. gündeme getirmek","syn":"1. raise, 2. introduce","ex":"She was **brought up** by her grandparents in a small village.","extr":"Küçük bir köyde büyükanne ve büyükbabası tarafından **büyütüldü**."},{"n":18,"w":"come down with","tr":"hastalığa yakalanmak","syn":"contract ons in Europe.","extr":"Şirket Avrupa'daki faaliyetlerini **azaltıyor**."},{"n":113,"w":"take on","tr":"1. işe almak, 2. benimsemek","syn":"1. hire, employ, 2. adopt, accept","ex":"The hospital plans to **take on** more nurses next year.","extr":"Hastane gelecek yıl daha fazla hemşire **işe almayı** planlıyor."},{"n":114,"w":"stave off","tr":"önlemek, savuşturmak","syn":"avert, prevent, ward off","ex":"The central bank raised interest rates to **stave off** inflation.","extr":"Merkez bankası enflasyonu **önlemek** için faiz oranlarını artırdı."},{"n":115,"w":"take off","tr":"1. havalanmak, 2. çıkarmak","syn":"1. become airborne, 2. remove","ex":"The plane **took off** two hours late.","extr":"Uçak iki saat geç **havalandı**."}];

/* ---------- data ---------- */
const ALL = [
  ...VERBS.map(e => ({...e, id:'v'+e.n, deck:'v'})),
  ...PHRASALS.map(e => ({...e, id:'p'+e.n, deck:'p'}))
];
const BYID = Object.fromEntries(ALL.map(e => [e.id, e]));
const DECK_NAME = {v:'Fiil', p:'Phrasal Verb'};
const MAXBOX = 5;
const BOX_COLORS = ['var(--line)','#d9534f','#e8833a','#e0b13a','#7cbf5a','#1f8a5b'];
const BOX_NAMES = ['Yeni','Bilmiyorum','Zayıf','Orta','İyi','Öğrenildi'];

/* ---------- storage (safe) ---------- */
const KEY = 'ydsKelime.v1';
let study = null, quiz = null;          // live sessions (saved inside S.sess)
let storageOK = false;
try { localStorage.setItem(KEY+'.test','1'); storageOK = localStorage.getItem(KEY+'.test')==='1'; localStorage.removeItem(KEY+'.test'); } catch(e){}
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
let S = load();
S.p = S.p || {};        // progress per id: {b:box, c:correct, w:wrong, t:lastTs}
S.star = S.star || {};
S.ui = S.ui || {deck:'v', view:'study', range:'all', subset:'all', dir:'en', qtype:'mix', qlen:20};
/* sessions are stored as plain ids so they survive closing the page */
function packSessions(){
  S.sess = {
    sig: S.ui.deck+'|'+S.ui.range+'|'+S.ui.subset,
    study: study && {queue:study.queue, i:study.i, total:study.total, known:study.known, again:study.again, hard:study.hard},
    quiz: quiz && {i: quiz.i + (quiz.answered ? 1 : 0), right:quiz.right, wrongs:quiz.wrongs,
                   qs: quiz.qs.map(q => ({id:q.e.id, type:q.type, ch: q.choices ? q.choices.map(c=>c.id) : null}))}
  };
}
function unpackSessions(){
  const ss = S.sess;
  if (!ss || ss.sig !== S.ui.deck+'|'+S.ui.range+'|'+S.ui.subset) return;
  if (ss.study && ss.study.queue.every(id => BYID[id])) study = {...ss.study, flipped:false};
  if (ss.quiz && ss.quiz.qs.every(x => BYID[x.id]))
    quiz = {i:ss.quiz.i, right:ss.quiz.right, wrongs:ss.quiz.wrongs, answered:false,
            qs: ss.quiz.qs.map(x => makeQuestion(BYID[x.id], x.type, x.ch))};
}
let saveTimer = null;
function save(){
  packSessions();
  S.savedAt = Date.now();
  const json = JSON.stringify(S);
  try { localStorage.setItem(KEY, json); } catch(e){}
  clearTimeout(saveTimer); saveTimer = setTimeout(() => { idbPut(json); cloudPush(); }, 800);   // copies in IndexedDB and account
  const ind = document.getElementById('saveInd');
  if (ind && (storageOK || cloud)){ ind.textContent = '✓ Kaydedildi'; ind.classList.add('show'); clearTimeout(ind._t); ind._t = setTimeout(()=>ind.classList.remove('show'), 1200); }
}
/* IndexedDB backup copy: restores progress if localStorage gets wiped */
function idb(){ return new Promise((res, rej) => { try {
  const r = indexedDB.open('ydsKelime', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
} catch(e){ rej(e); } }); }
function idbPut(json){ idb().then(db => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(json, KEY); tx.oncomplete = () => db.close(); }).catch(()=>{}); }
function idbGet(){ return idb().then(db => new Promise(res => { const r = db.transaction('kv').objectStore('kv').get(KEY); r.onsuccess = () => { res(r.result); db.close(); }; r.onerror = () => res(null); })).catch(() => null); }
function saveNow(){ save(); clearTimeout(saveTimer); idbPut(JSON.stringify(S)); cloudPush(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
window.addEventListener('pagehide', saveNow);

/* account sync: when opened on claude.ai the progress is kept with the viewer's account (private, every device) */
let cloud = null, cloudBusy = false, cloudDirty = false, cloudLast = '';
function cloudPush(){
  if (!cloud) return;
  const json = JSON.stringify(S);
  if (json === cloudLast) return;
  if (cloudBusy){ cloudDirty = true; return; }
  cloudBusy = true;
  cloud.set({json, savedAt: S.savedAt || Date.now()})
    .then(() => { cloudLast = json; })
    .catch(() => {})
    .finally(() => { cloudBusy = false; if (cloudDirty){ cloudDirty = false; cloudPush(); } });
}
function adoptState(d){
  S = d; S.p = S.p || {}; S.star = S.star || {};
  S.ui = S.ui || {deck:'v', view:'study', range:'all', subset:'all', dir:'en', qtype:'mix', qlen:20};
  study = null; quiz = null; unpackSessions();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (S.ui.theme) document.documentElement.dataset.theme = S.ui.theme;
  refresh(false);
}
async function cloudInit(){
  if (!window.claude || typeof window.claude.use !== 'function') return;
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!db || !user) return;
  const uid = await user.id();
  if (!uid) return;
  const ref = db.collection('data/users/' + uid).doc('progress');
  let snap;
  try {
    snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej('timeout'), 10000))]);
  } catch(e){ return; }
  cloud = ref;
  if (snap.exists){
    const d = snap.data();
    cloudLast = d.json;
    let remote = null; try { remote = JSON.parse(d.json); } catch(e){}
    if (remote && (remote.savedAt || 0) > (S.savedAt || 0)) adoptState(remote);
  }
  $('#storeWarn').classList.add('hidden');
  if (S.ui.view === 'stats') renderStats();
  cloudPush();
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
const prog = id => S.p[id] || {b:0,c:0,w:0,t:0};
function mark(id, ok){
  const p = {...prog(id)};
  if (ok === true){ p.b = p.b === 0 ? 3 : Math.min(MAXBOX, p.b + 1); p.c++; }   // a new word you already know starts at 'Orta'
  else if (ok === 'hard'){ p.b = Math.max(1, Math.min(p.b, 2)); p.c++; }
  else { p.b = 1; p.w++; }
  p.t = Date.now();
  S.p[id] = p; save();
}

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>');
const plain = s => String(s).replace(/\*\*/g,'');
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const norm = s => s.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim();

const ICON = {
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',
  starO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>'
};

/* ---------- speech ---------- */
const canSpeak = 'speechSynthesis' in window;
let enVoice = null;
function pickVoice(){ if(!canSpeak) return; const v = speechSynthesis.getVoices(); enVoice = v.find(x=>/en[-_]US/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null; }
if (canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if(!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(plain(text).replace(/\//g,' or '));
  u.lang = 'en-US'; if (enVoice) u.voice = enVoice; u.rate = .92;
  speechSynthesis.speak(u);
}
const speakBtn = (text, cls='speak') => canSpeak ? `<button class="${cls}" data-speak="${esc(plain(text))}" title="Dinle" aria-label="Dinle">${ICON.speak}</button>` : '';
const starBtn = id => `<button class="star ${S.star[id]?'on':''}" data-star="${id}" title="Yıldızla" aria-label="Yıldızla">${S.star[id]?ICON.star:ICON.starO}</button>`;
document.addEventListener('click', e => {
  const sp = e.target.closest('[data-speak]');
  if (sp){ e.stopPropagation(); speak(sp.dataset.speak); return; }
  const st = e.target.closest('[data-star]');
  if (st){
    e.stopPropagation();
    const id = st.dataset.star;
    if (S.star[id]) delete S.star[id]; else S.star[id] = 1;
    save();
    document.querySelectorAll(`[data-star="${id}"]`).forEach(b => { b.classList.toggle('on', !!S.star[id]); b.innerHTML = S.star[id]?ICON.star:ICON.starO; });
  }
}, true);

/* ---------- filtering ---------- */
function deckItems(){ return S.ui.deck === 'all' ? ALL : ALL.filter(e => e.deck === S.ui.deck); }
function ranges(){
  const out = [['all','Tümü']];
  if (S.ui.deck === 'all'){ out.push(['d:v','Sadece fiiller'],['d:p','Sadece phrasal verbs']); return out; }
  const n = deckItems().length;
  for (let i=1;i<=n;i+=25){ const j=Math.min(n,i+24); out.push([i+'-'+j, `${i}–${j}`]); }
  return out;
}
function pool(){
  let items = deckItems();
  const r = S.ui.range;
  if (r.startsWith('d:')) items = items.filter(e => e.deck === r.slice(2));
  else if (r !== 'all'){ const [a,b] = r.split('-').map(Number); items = items.filter(e => e.n>=a && e.n<=b); }
  const sub = S.ui.subset;
  if (sub==='new') items = items.filter(e => !S.p[e.id]);
  if (sub==='weak') items = items.filter(e => prog(e.id).b <= 2);
  if (sub==='star') items = items.filter(e => S.star[e.id]);
  if (sub==='notmastered') items = items.filter(e => prog(e.id).b < MAXBOX);
  return items;
}
function renderFilter(){
  const rs = ranges();
  if (!rs.some(x=>x[0]===S.ui.range)) S.ui.range = 'all';
  $('#rangeSel').innerHTML = rs.map(([v,l]) => `<option value="${v}" ${v===S.ui.range?'selected':''}>${l}</option>`).join('');
  $('#subsetSel').value = S.ui.subset;
  $('#countLbl').textContent = pool().length + ' kelime';
  $('#filterBar').classList.toggle('hidden', S.ui.view === 'stats');
}
$('#rangeSel').onchange = e => { S.ui.range = e.target.value; save(); refresh(true); };
$('#subsetSel').onchange = e => { S.ui.subset = e.target.value; save(); refresh(true); };

/* ---------- navigation ---------- */
document.querySelectorAll('#deckSeg button').forEach(b => b.onclick = () => { S.ui.deck = b.dataset.deck; S.ui.range='all'; save(); refresh(true); });
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { S.ui.view = b.dataset.view; save(); refresh(false); window.scrollTo(0,0); });
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  S.ui.theme = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.ui.theme; save();
};
if (S.ui.theme) document.documentElement.dataset.theme = S.ui.theme;

function refresh(resetSessions){
  document.querySelectorAll('#deckSeg button').forEach(b => b.classList.toggle('on', b.dataset.deck === S.ui.deck));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === S.ui.view));
  ['study','quiz','list','stats'].forEach(v => $('#view-'+v).classList.toggle('hidden', v !== S.ui.view));
  renderFilter();
  if (resetSessions){ study = null; quiz = null; save(); }
  ({study:renderStudy, quiz:renderQuiz, list:renderList, stats:renderStats})[S.ui.view]();
}

/* ---------- detail block (shared) ---------- */
function detailHTML(e){
  return `
    <div class="field"><div class="lb">Türkçe anlamı</div><div class="v big">${esc(e.tr)}</div></div>
    ${e.syn ? `<div class="field"><div class="lb">Eş anlamlılar</div><div class="v">${esc(e.syn)}</div></div>` : ''}
    ${e.ex ? `<div class="field"><div class="lb">Örnek cümle</div>
      <div class="v ex"><div>${fmt(e.ex)} ${speakBtn(e.ex,'speak')}</div><div class="tr">${fmt(e.extr)}</div></div></div>` : ''}`;
}

/* ---------- STUDY (flashcards, Leitner) ---------- */
function newStudy(){
  // lower boxes first, then least recently seen; small shuffle inside each box
  const items = pool();
  const groups = {};
  items.forEach(e => { const b = prog(e.id).b; (groups[b] = groups[b] || []).push(e); });
  let order = [];
  Object.keys(groups).sort((a,b)=>a-b).forEach(b => {
    order = order.concat(shuffle(groups[b]).sort((x,y) => prog(x.id).t - prog(y.id).t));
  });
  return {queue: order.map(e=>e.id), i:0, flipped:false, total: order.length, known:0, again:0, hard:0};
}
function renderStudy(){
  if (!study) study = newStudy();   // saved with the first answer, so opening the page never overwrites a newer save
  const el = $('#view-study');
  const dirSeg = `<div class="seg" id="dirSeg">
      <button data-dir="en" class="${S.ui.dir==='en'?'on':''}">İngilizce → Türkçe</button>
      <button data-dir="tr" class="${S.ui.dir==='tr'?'on':''}">Türkçe → İngilizce</button></div>`;
  if (!study.total){
    el.innerHTML = `<div class="toolbar">${dirSeg}</div><div class="card empty">Bu filtrede kelime yok. Aralığı veya kelime seçimini değiştirin.</div>`;
    bindDir(); return;
  }
  if (study.i >= study.queue.length){
    el.innerHTML = `<div class="toolbar">${dirSeg}</div>
      <div class="card done">
        <div class="big">Tur bitti</div>
        <p class="muted">${study.total} kartın ${study.known} tanesini bildin, ${study.hard} tanesi zor geldi, ${study.again} tanesi tekrar edilecek.</p>
        <div class="row-actions" style="justify-content:center">
          <button class="btn primary" id="againBtn">Yeni tur başlat</button>
          <button class="btn" id="toQuiz">Test çöz</button>
        </div>
      </div>`;
    bindDir();
    $('#againBtn').onclick = () => { study = newStudy(); save(); renderStudy(); };
    $('#toQuiz').onclick = () => { S.ui.view='quiz'; save(); refresh(false); };
    return;
  }
  const e = BYID[study.queue[study.i]];
  const p = prog(e.id);
  const front = S.ui.dir === 'en'
    ? `<div class="w">${esc(e.w)}</div>`
    : `<div class="tr">${esc(e.tr)}</div>${e.syn?`<div class="muted" style="margin-top:8px">(${esc(e.syn)})</div>`:''}`;
  const pct = Math.round(study.i / study.queue.length * 100);
  el.innerHTML = `
    <div class="toolbar">${dirSeg}</div>
    <div class="progressbar"><i style="width:${pct}%"></i></div>
    <div class="fc-meta"><span>${study.i+1} / ${study.queue.length}</span><span>${DECK_NAME[e.deck]} #${e.n}</span></div>
    <div class="flash ${study.flipped?'flipped':''}" id="flash" role="button" tabindex="0" aria-label="Kartı çevir">
      <div class="flash-in">
        <div class="face front card">
          <div class="face-top"><span class="badge b${p.b}">${BOX_NAMES[p.b]}</span><span>${S.ui.dir==='en'?speakBtn(e.w):''}${starBtn(e.id)}</span></div>
          <div class="front-word">${front}<div class="hint">Anlamını düşün, sonra karta dokun</div></div>
        </div>
        <div class="face back card">
          <div class="face-top"><div style="display:flex;align-items:center;gap:8px"><span class="w">${esc(e.w)}</span>${speakBtn(e.w)}</div>${starBtn(e.id)}</div>
          ${detailHTML(e)}
        </div>
      </div>
    </div>
    <div class="rate ${study.flipped?'':'hidden'}" id="rate">
      <button class="btn bad" data-r="no">Bilmiyorum<span class="kbd">1</span></button>
      <button class="btn warn" data-r="hard">Zor<span class="kbd">2</span></button>
      <button class="btn good" data-r="yes">Biliyorum<span class="kbd">3</span></button>
    </div>
    <div class="${study.flipped?'hidden':''}" id="flipRow"><button class="btn primary" style="width:100%" id="flipBtn">Cevabı göster<span class="kbd">Boşluk</span></button></div>`;
  bindDir();
  const flip = () => { study.flipped = !study.flipped; $('#flash').classList.toggle('flipped', study.flipped); $('#rate').classList.toggle('hidden', !study.flipped); $('#flipRow').classList.toggle('hidden', study.flipped); };
  $('#flash').onclick = flip; $('#flipBtn').onclick = flip;
  el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => rate(b.dataset.r));
}
function rate(r){
  const id = study.queue[study.i];
  if (r === 'yes'){ mark(id, true); study.known++; }
  else if (r === 'hard'){ mark(id, 'hard'); study.hard++; study.queue.splice(Math.min(study.queue.length, study.i + 8), 0, id); }
  else { mark(id, false); study.again++; study.queue.splice(Math.min(study.queue.length, study.i + 4), 0, id); }
  study.i++; study.flipped = false; save(); renderStudy();
}
function bindDir(){
  document.querySelectorAll('#dirSeg button').forEach(b => b.onclick = () => { S.ui.dir = b.dataset.dir; save(); study.flipped=false; renderStudy(); });
}

/* ---------- QUIZ ---------- */
const QTYPES = {
  mix:'Karışık', en2tr:'Anlamı seç', tr2en:'Kelimeyi seç', syn:'Eş anlamlı', blank:'Boşluk doldur', type:'Yazarak cevapla'
};
function blankSentence(ex){ return esc(ex).replace(/\*\*(.+?)\*\*/g, '<span class="blank">_____</span>'); }
function distractors(e, k, field){
  const cands = shuffle(ALL.filter(x => x.deck === e.deck && x.id !== e.id && x[field] && norm(x[field]) !== norm(e[field])
    && !(e.syn && norm(e.syn).includes(norm(x.w))) && !(x.syn && norm(x.syn).includes(norm(e.w)))));
  const out = [], seen = new Set([norm(e[field])]);
  for (const c of cands){ if (!seen.has(norm(c[field]))){ seen.add(norm(c[field])); out.push(c); } if (out.length===k) break; }
  return out;
}
function makeQuestion(e, type, chIds){
  if (type === 'mix'){
    const opts = ['en2tr','tr2en','blank','type'];
    if (e.syn) opts.push('syn');
    type = opts[Math.floor(Math.random()*opts.length)];
  }
  if (type === 'syn' && !e.syn) type = 'en2tr';
  if (type === 'blank' && !e.ex) type = 'tr2en';
  if (type === 'type') return {e, type, prompt: esc(e.tr), sub:'İngilizce karşılığını yaz', answer: e.w};
  const field = type === 'en2tr' ? 'tr' : 'w';
  const ch = chIds ? chIds.map(id => BYID[id]).filter(Boolean) : shuffle([e, ...distractors(e, 3, field)]);
  const q = {e, type, choices: ch.map(c => ({id:c.id, label: field==='tr' ? c.tr : c.w}))};
  if (type === 'en2tr'){ q.prompt = esc(e.w); q.sub = 'Türkçe anlamı hangisi?'; }
  if (type === 'tr2en'){ q.prompt = esc(e.tr); q.sub = 'İngilizce karşılığı hangisi?'; }
  if (type === 'syn'){ q.prompt = esc(e.syn); q.sub = 'Bu eş anlamlılar hangi kelimeye ait?'; }
  if (type === 'blank'){ q.prompt = blankSentence(e.ex); q.sent = true; q.sub = 'Boşluğa hangisi gelmeli? (cümlede çekimli hali kullanılmış olabilir)'; }
  return q;
}
function newQuiz(){
  const items = pool();
  if (!items.length) return {qs:[], i:0};
  // weight weaker words higher
  const weighted = shuffle(items).sort((a,b) => (prog(a.id).b - prog(b.id).b) + (Math.random()-.5)*2.5);
  const n = S.ui.qlen === 0 ? weighted.length : Math.min(S.ui.qlen, weighted.length);
  const qs = shuffle(weighted.slice(0, n)).map(e => makeQuestion(e, S.ui.qtype));
  return {qs, i:0, right:0, answered:false, wrongs:[]};
}
function renderQuiz(){
  const el = $('#view-quiz');
  if (!quiz){
    el.innerHTML = `
      <div class="card" style="padding:20px;margin-top:4px">
        <h2 style="margin-top:0">Test ayarları</h2>
        <div class="toolbar" style="margin:12px 0">
          <label for="qtype">Soru tipi</label>
          <select id="qtype">${Object.entries(QTYPES).map(([k,v])=>`<option value="${k}" ${k===S.ui.qtype?'selected':''}>${v}</option>`).join('')}</select>
          <label for="qlen">Soru sayısı</label>
          <select id="qlen">${[10,20,30,50,0].map(n=>`<option value="${n}" ${n===S.ui.qlen?'selected':''}>${n||'Hepsi'}</option>`).join('')}</select>
        </div>
        <ul class="help">
          <li><b>Anlamı seç:</b> İngilizce kelime → Türkçe anlam</li>
          <li><b>Kelimeyi seç:</b> Türkçe anlam → İngilizce kelime</li>
          <li><b>Eş anlamlı:</b> verilen eş anlamlılardan kelimeyi bul (YDS tarzı)</li>
          <li><b>Boşluk doldur:</b> örnek cümledeki boşluğa uygun kelimeyi seç</li>
          <li><b>Yazarak:</b> Türkçe anlamı gör, İngilizcesini yaz</li>
        </ul>
        <p class="help">Seçili filtrede <b>${pool().length}</b> kelime var. Zayıf kelimeler daha sık sorulur; her cevap ilerlemeni günceller.</p>
        <button class="btn primary" id="startQuiz" ${pool().length?'':'disabled'}>Testi başlat</button>
      </div>`;
    $('#qtype').onchange = e => { S.ui.qtype = e.target.value; save(); };
    $('#qlen').onchange = e => { S.ui.qlen = +e.target.value; save(); };
    $('#startQuiz').onclick = () => { quiz = newQuiz(); save(); renderQuiz(); };
    return;
  }
  if (quiz.i >= quiz.qs.length){
    const pct = Math.round(quiz.right / quiz.qs.length * 100);
    el.innerHTML = `<div class="card done">
        <div class="big">%${pct}</div>
        <div class="score-row"><div><b style="color:var(--good)">${quiz.right}</b>doğru</div><div><b style="color:var(--bad)">${quiz.qs.length-quiz.right}</b>yanlış</div></div>
        <div class="row-actions" style="justify-content:center">
          <button class="btn primary" id="qAgain">Yeni test</button>
          ${quiz.wrongs.length?'<button class="btn" id="qWrong">Yanlışları tekrar sor</button>':''}
          <button class="btn" id="qSettings">Ayarlar</button>
        </div>
        ${quiz.wrongs.length ? `<div class="review-list" style="text-align:left">${quiz.wrongs.map(id=>{const e=BYID[id];return `<div class="it"><b>${esc(e.w)}</b> — ${esc(e.tr)}</div>`}).join('')}</div>`:''}
      </div>`;
    $('#qAgain').onclick = () => { quiz = newQuiz(); save(); renderQuiz(); };
    $('#qSettings').onclick = () => { quiz = null; save(); renderQuiz(); };
    if ($('#qWrong')) $('#qWrong').onclick = () => {
      const qs = shuffle(quiz.wrongs).map(id => makeQuestion(BYID[id], S.ui.qtype));
      quiz = {qs, i:0, right:0, answered:false, wrongs:[]}; save(); renderQuiz();
    };
    return;
  }
  const q = quiz.qs[quiz.i];
  const pct = Math.round(quiz.i / quiz.qs.length * 100);
  const body = q.type === 'type'
    ? `<form class="typebox" id="typeForm" autocomplete="off"><input type="text" id="typeIn" placeholder="ör. abandon" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn primary">Kontrol</button></form>
       <button class="btn" id="skipBtn" style="margin-top:8px">Bilmiyorum, göster</button>`
    : `<div class="opts">${q.choices.map((c,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(c.label)}</span></button>`).join('')}</div>`;
  el.innerHTML = `
    <div class="progressbar" style="margin-top:6px"><i style="width:${pct}%"></i></div>
    <div class="fc-meta"><span>Soru ${quiz.i+1} / ${quiz.qs.length}</span><span>Doğru: ${quiz.right}</span></div>
    <div class="card q-prompt">
      <div class="q-type">${QTYPES[q.type]} · ${DECK_NAME[q.e.deck]}</div>
      <div class="q-text ${q.sent?'sent':''}">${q.prompt}</div>
      <div class="muted" style="margin-top:8px;font-size:14px">${q.sub}</div>
    </div>
    ${body}
    <div id="fb"></div>`;
  if (q.type === 'type'){
    const inp = $('#typeIn'); setTimeout(()=>inp.focus(), 30);
    $('#typeForm').onsubmit = ev => { ev.preventDefault(); if (!quiz.answered && inp.value.trim()) answerTyped(inp.value); };
    $('#skipBtn').onclick = () => { if (!quiz.answered) answerTyped(''); };
  } else {
    el.querySelectorAll('.opt').forEach(b => b.onclick = () => answerChoice(+b.dataset.i));
  }
}
function acceptable(w){
  // "count on/upon" -> ["count on","count upon"]; "cut out/off"
  const s = norm(w); const out = new Set([s]);
  const m = s.match(/^(.*?)(\S+)\/(\S+)(.*)$/);
  if (m){ out.add(norm(m[1]+m[2]+m[4])); out.add(norm(m[1]+m[3]+m[4])); }
  return [...out];
}
function answerTyped(val){
  const q = quiz.qs[quiz.i]; quiz.answered = true;
  const ok = val && acceptable(q.answer).includes(norm(val));
  finish(q, ok);
  $('#typeIn').disabled = true;
}
function answerChoice(i){
  if (quiz.answered) return;
  const q = quiz.qs[quiz.i]; quiz.answered = true;
  const ok = q.choices[i].id === q.e.id;
  document.querySelectorAll('.opt').forEach((b,j) => {
    b.disabled = true;
    if (q.choices[j].id === q.e.id) b.classList.add('right');
    else if (j === i) b.classList.add('wrong');
  });
  finish(q, ok);
}
function finish(q, ok){
  mark(q.e.id, ok);
  if (ok) quiz.right++; else quiz.wrongs.push(q.e.id);
  save();
  const e = q.e;
  $('#fb').innerHTML = `<div class="card feedback ${ok?'ok':'no'}">
      <div style="display:flex;align-items:center;gap:8px;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:8px"><b style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'Doğru!':'Yanlış'}</b><span style="font-weight:700;font-size:18px">${esc(e.w)}</span>${speakBtn(e.w)}</div>${starBtn(e.id)}
      </div>
      ${detailHTML(e)}
    </div>
    <button class="btn primary" id="nextQ" style="width:100%;margin-top:12px">Sonraki<span class="kbd">Enter</span></button>`;
  $('#nextQ').onclick = nextQ;
  $('#nextQ').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function nextQ(){ quiz.i++; quiz.answered = false; save(); renderQuiz(); window.scrollTo({top:0}); }

/* ---------- LIST ---------- */
let listQuery = '';
function renderList(){
  const el = $('#view-list');
  if (!$('#listSearch')){
    el.innerHTML = `<input type="search" id="listSearch" placeholder="Ara: İngilizce, Türkçe veya eş anlamlı…" aria-label="Ara"><div class="list" id="listBody" style="margin-top:12px"></div>`;
    $('#listSearch').oninput = e => { listQuery = e.target.value; renderListBody(); };
  }
  $('#listSearch').value = listQuery;
  renderListBody();
}
function renderListBody(){
  const q = norm(listQuery);
  const items = pool().filter(e => !q || [e.w,e.tr,e.syn,plain(e.ex||'')].some(f => norm(f||'').includes(q)));
  const body = $('#listBody');
  if (!items.length){ body.innerHTML = '<div class="empty">Sonuç yok.</div>'; return; }
  body.innerHTML = items.map(e => { const p = prog(e.id); return `
    <div class="card item">
      <div class="item-h"><span class="n">${S.ui.deck==='all'?(e.deck==='v'?'F':'PV'):''}${e.n}</span><span class="w">${esc(e.w)}</span>
        <span class="sp"><span class="badge b${p.b}">${BOX_NAMES[p.b]}</span>${speakBtn(e.w)}${starBtn(e.id)}</span></div>
      <div class="tr">${esc(e.tr)}</div>
      ${e.syn?`<div class="syn">${esc(e.syn)}</div>`:''}
      ${e.ex?`<details><summary>Örnek cümle</summary><div class="ex" style="margin-top:6px"><div>${fmt(e.ex)}</div><div class="tr muted" style="font-weight:400">${fmt(e.extr)}</div></div></details>`:''}
    </div>`; }).join('');
}

/* ---------- STATS ---------- */
function renderStats(){
  const el = $('#view-stats');
  const block = (title, items) => {
    const counts = Array(MAXBOX+1).fill(0);
    items.forEach(e => counts[prog(e.id).b]++);
    const seen = items.length - counts[0];
    const c = items.reduce((s,e)=>s+prog(e.id).c,0), w = items.reduce((s,e)=>s+prog(e.id).w,0);
    return `<h2>${title}</h2>
      <div class="stats-grid">
        <div class="card stat"><b>${counts[MAXBOX]}<span style="font-size:16px"> / ${items.length}</span></b><span>öğrenildi</span></div>
        <div class="card stat"><b>${seen}</b><span>çalışıldı</span></div>
        <div class="card stat"><b>${c+w ? Math.round(c/(c+w)*100)+'%' : '–'}</b><span>doğruluk oranı</span></div>
      </div>
      <div class="boxes">${counts.map((n,i)=> n ? `<i style="width:${n/items.length*100}%;background:${BOX_COLORS[i]}" title="${BOX_NAMES[i]}: ${n}"></i>` : '').join('')}</div>
      <div class="legend">${counts.map((n,i)=>`<span style="--c:${BOX_COLORS[i]}">${BOX_NAMES[i]}: ${n}</span>`).join('')}</div>`;
  };
  el.innerHTML = block('Fiiller (200)', ALL.filter(e=>e.deck==='v')) + block('Phrasal Verbs (115)', ALL.filter(e=>e.deck==='p')) + `
    <h2>Nasıl çalışır?</h2>
    <ul class="help">
      <li>Her kelime 0–5 arası bir <b>kutuda</b> durur. "Biliyorum" ya da doğru cevap bir üst kutuya taşır (yeni kelimeyi ilk seferde bilirsen doğrudan "Orta"ya geçer); "Bilmiyorum" ya da yanlış cevap kutu 1'e düşürür.</li>
      <li>Kartlar ve testler önce düşük kutudaki kelimeleri getirir. Kutu 5 = öğrenildi.</li>
      <li>Klavye: <b>Boşluk</b> kartı çevirir, <b>1/2/3</b> değerlendirir; testte <b>1–4</b> veya <b>A–D</b> şık seçer, <b>Enter</b> sonraki soru.</li>
      <li>İlerleme her cevaptan sonra ve sayfadan çıkarken otomatik kaydedilir; yarıda bıraktığın kart turu ve test de kaldığın yerden devam eder. Kayıt bu cihazdaki tarayıcıda durur, başka cihaza taşımak için dışa aktar / içe aktar kullan.</li>
    </ul>
    <p class="help" id="saveStatus">${cloud ? `Otomatik kayıt <b style="color:var(--good)">açık</b>: ilerleme Claude hesabına kaydediliyor, her cihazda aynı kaldığın yerden devam edersin${S.savedAt ? ' · son kayıt: ' + new Date(S.savedAt).toLocaleString('tr-TR') : ''}` : storageOK ? `Otomatik kayıt <b style="color:var(--good)">açık</b>${S.savedAt ? ' · son kayıt: ' + new Date(S.savedAt).toLocaleString('tr-TR') : ''}` : '<b style="color:var(--bad)">Otomatik kayıt bu tarayıcıda çalışmıyor</b> — dışa aktararak yedek al.'}</p>
    <div class="row-actions">
      <button class="btn" id="exportBtn">İlerlemeyi dışa aktar</button>
      <label class="btn" style="display:inline-flex;align-items:center">İçe aktar<input type="file" id="importIn" accept=".json,application/json" class="hidden"></label>
      <button class="btn bad" id="resetBtn">İlerlemeyi sıfırla</button>
    </div>
    <p class="help" id="ioMsg" aria-live="polite"></p>`;
  const msg = t => { $('#ioMsg').textContent = t; };
  $('#exportBtn').onclick = async () => {
    const data = JSON.stringify({p:S.p, star:S.star}, null, 1), filename = 'yds-kelime-ilerleme.json';
    const dl = window.claude && typeof window.claude.use === 'function' ? await claude.use('downloads') : null;
    if (dl){ try { await dl.save({filename, data}); msg('Yedek dosyası kaydedildi.'); } catch(e){ msg('Yedek kaydedilmedi.'); } return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'})); a.download = filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  };
  $('#importIn').onchange = ev => {
    const f = ev.target.files[0]; if (!f) return;
    f.text().then(t => { const d = JSON.parse(t); if (!d.p) throw 0; S.p = d.p; S.star = d.star || {}; study = null; quiz = null; saveNow(); refresh(true); $('#ioMsg').textContent = 'İlerleme içe aktarıldı.'; })
     .catch(() => msg('Dosya okunamadı. İlerleme yedeği olan .json dosyasını seç.'));
  };
  $('#resetBtn').onclick = ev => {
    const b = ev.currentTarget;
    if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Emin misin? Silmek için tekrar bas'; setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = 'İlerlemeyi sıfırla'; } }, 4000); return; }
    S.p = {}; S.star = {}; study = null; quiz = null; saveNow(); refresh(true);
  };
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', ev => {
  if (ev.target.matches('input,select,textarea') && ev.key !== 'Enter') return;
  if (S.ui.view === 'study' && study && study.i < study.queue.length){
    if ((ev.key === ' ' || ev.key === 'Enter') && !(ev.target.closest('button') && ev.target.id !== 'flash')){ ev.preventDefault(); $('#flash').click(); }
    else if (study.flipped && ['1','2','3'].includes(ev.key)) rate({1:'no',2:'hard',3:'yes'}[ev.key]);
  }
  if (S.ui.view === 'quiz' && quiz && quiz.i < quiz.qs.length){
    const q = quiz.qs[quiz.i];
    if (quiz.answered && ev.key === 'Enter'){ ev.preventDefault(); nextQ(); return; }
    if (!quiz.answered && q.type !== 'type'){
      const k = ev.key.toLowerCase(); const i = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
      if (i >= 0 && i < q.choices.length) answerChoice(i);
    }
  }
});

unpackSessions();
refresh(false);
if (!storageOK) $('#storeWarn').classList.remove('hidden');
// if localStorage was cleared but IndexedDB still has a newer copy, bring it back
idbGet().then(json => {
  if (!json) { if (S.savedAt) idbPut(JSON.stringify(S)); return; }
  let d; try { d = JSON.parse(json); } catch(e){ return; }
  if ((d.savedAt||0) > (S.savedAt||0) && d.p) adoptState(d);
}).then(cloudInit);

/* ---------- offline cache when served over http(s) ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
