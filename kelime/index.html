<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>YDS Kelime Çalışma</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f1ea; --surface:#fffdf8; --surface-2:#efeadf; --ink:#1d2433; --muted:#636b7a;
  --line:#ddd6c8; --accent:#1f5fa8; --accent-ink:#fff; --accent-soft:#dce8f6;
  --good:#1f8a5b; --good-soft:#d7f0e3; --bad:#c0392b; --bad-soft:#f8dcd8; --warn:#b7791f; --warn-soft:#f7ead2;
  --hl:#fff0b3; --shadow:0 1px 2px rgba(20,25,35,.06),0 6px 20px rgba(20,25,35,.07);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b; --surface:#1b2029; --surface-2:#232a35; --ink:#e7eaf0; --muted:#9aa3b2;
    --line:#2f3745; --accent:#6aa7ff; --accent-ink:#0d1420; --accent-soft:#1e2f48;
    --good:#4fcf91; --good-soft:#173a2a; --bad:#ff7a6b; --bad-soft:#40211e; --warn:#f0b452; --warn-soft:#3b2e17;
    --hl:#4a3f12; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1b2029; --surface-2:#232a35; --ink:#e7eaf0; --muted:#9aa3b2;
  --line:#2f3745; --accent:#6aa7ff; --accent-ink:#0d1420; --accent-soft:#1e2f48;
  --good:#4fcf91; --good-soft:#173a2a; --bad:#ff7a6b; --bad-soft:#40211e; --warn:#f0b452; --warn-soft:#3b2e17;
  --hl:#4a3f12; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:750;letter-spacing:-.01em;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.toolbar label{font-size:13px;color:var(--muted)}
select,input[type=search],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:38px}
input[type=search],input[type=text]{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.kbd{font-size:11px;opacity:.6;font-weight:500;margin-left:6px}
.muted{color:var(--muted)}
.hidden{display:none!important}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:3px}
h2{font-size:20px;margin:20px 0 8px;letter-spacing:-.01em}

/* flashcard */
.progressbar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.fc-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:8px 2px}
.flash{perspective:1400px;margin:8px 0 14px;cursor:pointer;user-select:none}
.flash-in{position:relative;min-height:340px;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:22px;display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg)}
.front-word{margin:auto;text-align:center}
.front-word .w{font-size:clamp(30px,8vw,46px);font-weight:750;letter-spacing:-.02em;line-height:1.15}
.front-word .tr{font-size:clamp(20px,5vw,26px);font-weight:600;line-height:1.3}
.front-word .hint{margin-top:14px;color:var(--muted);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600}
.badge.b0{background:var(--surface-2)} .badge.b1,.badge.b2{background:var(--bad-soft);color:var(--bad)}
.badge.b3{background:var(--warn-soft);color:var(--warn)} .badge.b4,.badge.b5{background:var(--good-soft);color:var(--good)}
.face-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.back .w{font-size:26px;font-weight:750;letter-spacing:-.01em}
.field{margin-top:12px}
.field .lb{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.field .v{margin-top:2px}
.field .v.big{font-size:19px;font-weight:600}
.ex{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.ex .tr{color:var(--muted);margin-top:4px;font-size:15px}
.speak{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.speak svg{width:17px;height:17px}
.star{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;display:inline-grid;place-items:center}
.star svg{width:22px;height:22px}
.star.on{color:#e0a100}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.done{text-align:center;padding:36px 20px}
.done .big{font-size:44px;font-weight:800}

/* quiz */
.q-prompt{padding:22px;margin:8px 0 14px}
.q-type{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.q-text{font-size:clamp(22px,5.5vw,30px);font-weight:700;margin-top:6px;line-height:1.3}
.q-text.sent{font-size:clamp(17px,4.2vw,20px);font-weight:500;line-height:1.55}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;text-align:center}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:52px;display:flex;gap:12px;align-items:center;font-size:16px}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;padding:14px 16px}
.feedback.ok{border-color:var(--good)} .feedback.no{border-color:var(--bad)}
.typebox{display:flex;gap:8px}
.typebox input{font-size:18px}
.score-row{display:flex;gap:16px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.score-row div{text-align:center}
.score-row b{display:block;font-size:28px}
.review-list{margin-top:12px}
.review-list .it{padding:10px 0;border-top:1px solid var(--line)}

/* list */
.list{display:grid;gap:10px}
.item{padding:14px 16px}
.item-h{display:flex;align-items:center;gap:8px}
.item-h .n{color:var(--muted);font-size:13px;min-width:30px;font-variant-numeric:tabular-nums}
.item-h .w{font-weight:700;font-size:18px}
.item-h .sp{margin-left:auto;display:flex;gap:4px;align-items:center}
.item .tr{font-weight:600;margin-top:2px}
.item .syn{color:var(--muted);font-size:14px}
.item details{margin-top:6px}
.item summary{cursor:pointer;color:var(--accent);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{padding:16px}
.stat b{font-size:28px;display:block;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.boxes{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:10px 0;background:var(--surface-2)}
.boxes i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.help{font-size:14px;color:var(--muted)}
#saveInd{font-size:12px;color:var(--good);font-weight:600;opacity:0;transition:opacity .3s}
#saveInd.show{opacity:1}
.warnbox{margin-top:14px;padding:14px 16px;background:var(--warn-soft);border-color:var(--warn);font-size:14px}
.help li{margin:4px 0}
@media (max-width:620px){
  .brand small{display:none}
  .top-in{gap:8px}
  #deckSeg{order:3;width:100%}
  #deckSeg button{flex:1}
  #filterBar label{display:none}
  #filterBar select{flex:1;min-width:0}
  #countLbl{width:100%}
  #dirSeg{width:100%} #dirSeg button{flex:1;padding:6px 6px}
  .flash-in{min-height:400px}
  .kbd{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">YDS Kelime <small>offline çalışma</small></div>
    <div class="seg" id="deckSeg" role="tablist" aria-label="Liste seçimi">
      <button data-deck="v">Fiiller</button>
      <button data-deck="p">Phrasal Verbs</button>
      <button data-deck="all">Tümü</button>
    </div>
    <span id="saveInd" aria-live="polite"></span>
    <button class="iconbtn" id="themeBtn" title="Tema değiştir" aria-label="Tema değiştir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div id="storeWarn" class="card warnbox hidden">
    <b>Bu tarayıcı ilerlemeyi kaydetmiyor.</b>
    Dosya bir önizleyicide, gizli sekmede ya da depolamanın kapalı olduğu bir uygulamada açılmış olabilir.
    Dosyayı Chrome, Safari veya Firefox ile doğrudan aç. O zamana kadar çıkmadan önce <b>İlerleme → İlerlemeyi dışa aktar</b> ile yedek al.
  </div>
  <!-- filter shared by study/quiz/list -->
  <div class="toolbar" id="filterBar">
    <label for="rangeSel">Aralık</label>
    <select id="rangeSel"></select>
    <label for="subsetSel">Kelimeler</label>
    <select id="subsetSel">
      <option value="all">Hepsi</option>
      <option value="new">Yeni (hiç çalışılmamış)</option>
      <option value="weak">Zayıf (kutu 0–2)</option>
      <option value="star">Yıldızlılar</option>
      <option value="notmastered">Öğrenilmemişler</option>
    </select>
    <span class="muted" id="countLbl" style="font-size:13px"></span>
  </div>

  <section id="view-study"></section>
  <section id="view-quiz" class="hidden"></section>
  <section id="view-list" class="hidden"></section>
  <section id="view-stats" class="hidden"></section>
</main>

<nav class="tabs">
  <div class="in">
    <button data-view="study" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="14" height="15" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v13"/></svg>Kartlar</button>
    <button data-view="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>Test</button>
    <button data-view="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Liste</button>
    <button data-view="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>İlerleme</button>
  </div>
</nav>

<script>
const VERBS = [{"n":1,"w":"abandon","tr":"terk etmek; bırakmak, vazgeçmek","syn":"leave, desert; forsake, give up, quit","ex":"Faced with insurmountable evidence, the scientist was forced to **abandon** her long-held hypothesis.","extr":"Karşı konulmaz kanıtlarla yüzleşen bilim insanı, uzun zamandır savunduğu hipotezinden **vazgeçmek** zorunda kaldı."},{"n":2,"w":"accelerate","tr":"hızlandırmak, ivmelendirmek","syn":"speed up, expedite","ex":"The proliferation of digital technologies has dramatically **accelerated** the pace of cultural exchange and globalization.","extr":"Dijital teknolojilerin yaygınlaşması, kültürel alışverişin ve küreselleşmenin **hızını **önemli ölçüde **artırmıştır**."},{"n":3,"w":"accompany","tr":"eşlik etmek, beraberinde getirmek, birlikte olmak","syn":"escort, attend","ex":"Rapid economic growth in the region is often **accompanied** by significant social dislocation and environmental degradation.","extr":"Bölgedeki hızlı ekonomik büyüme, genellikle önemli sosyal düzensizlikler ve çevresel bozulmayla **birlikte gelmektedir**."},{"n":4,"w":"accumulate","tr":"biriktirmek, yığmak, birikmek","syn":"amass, gather, collect, pile up","ex":"Mercury vapour when inhaled is absorbed into the blood stream and may **accumulate** in various organs, including the brain.","extr":"Cıva buharı solunduğunda kan dolaşımına emilir ve beyin dahil çeşitli organlarda **birikebilir**."},{"n":5,"w":"achieve","tr":"başarmak, elde etmek, ulaşmak","syn":"attain, accomplish","ex":"The treaty represents a delicate compromise, **achieved** after years of arduous and often contentious negotiations.","extr":"Antlaşma, yıllar süren zahmetli ve genellikle tartışmalı müzakereler sonucunda **elde edilmiş** hassas bir uzlaşıyı temsil ediyor."},{"n":6,"w":"acknowledge","tr":"kabul etmek, onaylamak, (bir şeyi) fark ettiğini göstermek","syn":"recognize, admit, concede","ex":"While the report **acknowledges** the potential risks of the new technology, it argues that the benefits to public health far outweigh them.","extr":"Rapor, yeni teknolojinin potansiyel risklerini **kabul etmekle** birlikte, kamu sağlığına faydalarının bu riskleri fazlasıyla aştığını savunuyor."},{"n":7,"w":"acquire","tr":"edinmek, kazanmak, elde etmek, satın almak (şirket vb.)","syn":"obtain, gain","ex":"True fluency in a language involves more than just **acquiring** vocabulary; it requires an intuitive grasp of its cultural nuances.","extr":"Bir dilde gerçek akıcılık, yalnızca kelime dağarcığı **edinmekten** daha fazlasını içerir; o dilin kültürel inceliklerini sezgisel olarak kavramayı gerektirir."},{"n":8,"w":"administer","tr":"yönetmek, idare etmek; uygulamak (test/ilaç vb.), vermek","syn":"manage, execute; dispense","ex":"The effectiveness of a policy depends not only on its design but also on the capacity of institutions to **administer** it efficiently and equitably.","extr":"Bir politikanın etkinliği, yalnızca tasarımına değil, aynı zamanda onu verimli ve adil bir şekilde **uygulayacak** kurumların kapasitesine de bağlıdır."},{"n":9,"w":"admit","tr":"kabul etmek (suç/gerçek/hata); giriş izni vermek, içeri almak","syn":"confess, acknowledge, concede; grant entrance","ex":"The researchers were forced to **admit** that the initial hypothesis was flawed after analyzing the comprehensive data set.","extr":"Araştırmacılar, kapsamlı veri setini analiz ettikten sonra başlangıçtaki hipotezin kusurlu olduğunu **kabuletmek** zorunda kaldılar."},{"n":10,"w":"adopt","tr":"benimsemek, (yasa/karar vb.) kabul etmek; evlat edinmek","syn":"embrace, take on, approve","ex":"Companies slow to **adopt** sustainable practices may find themselves at a strategic disadvantage as both regulations and consumer preferences evolve.","extr":"Sürdürülebilir uygulamaları **benimsemekte** yavaş kalan şirketler, hem düzenlemeler hem de tüketici tercihleri geliştikçe kendilerini stratejik bir dezavantajda bulabilirler."},{"n":11,"w":"aggravate","tr":"kötüleştirmek, şiddetlendirmek, ağırlaştırmak","syn":"worsen, exacerbate, intensify, deepen, heighten","ex":"The government's inflammatory rhetoric served only to **aggravate** social tensions, pushing the fragile peace to its breaking point.","extr":"Hükümetin kışkırtıcı söylemi, yalnızca toplumsal gerilimleri **şiddetlendirdi** ve kırılgan barışı kopma noktasına getirdi."},{"n":12,"w":"alienate","tr":"yabancılaştırmak, uzaklaştırmak, soğutmak","syn":"estrange, disaffect","ex":"The leader's autocratic decisions began to **alienate** key allies, eroding the coalition's unity from within.","extr":"Liderin otokratik kararları, kilit müttefikleri **uzaklaştırarak** koalisyonun birliğini içten içe aşındırmaya başladı."},{"n":13,"w":"alleviate","tr":"hafifletmek, azaltmak, dindirmek","syn":"mitigate, ease, relieve, lessen","ex":"International aid was crucial to **alleviate** the immediate humanitarian crisis, though long-term solutions required structural reforms.","extr":"Uluslararası yardım, acil insani krizi **hafifletmek** için çok önemliydi; ancak uzun vadeli çözümler yapısal reformlar gerektiriyordu."},{"n":14,"w":"allocate","tr":"tahsis etmek, ayırmak, bölüştürmek","syn":"assign, allot, distribute","ex":"The committee must decide how to optimally **allocate** the limited research funds among the numerous promising proposals.","extr":"Komite, sınırlı araştırma fonlarını, birbirinden umut veren çok sayıda proje önerisi arasında nasıl en uygun şekilde **tahsis edeceğine** karar vermelidir."},{"n":15,"w":"alter","tr":"değiştirmek, başkalaştırmak, değişmek","syn":"change, modify, transform","ex":"The discovery fundamentally **altered** our understanding of the universe, challenging centuries- old scientific paradigms.","extr":"Bu keşif, evren anlayışımızı kökten **değiştirerek** yüzyıllık bilimsel paradigmalara meydan okudu."},{"n":16,"w":"apply","tr":"uygulamak; başvurmak; ilişkin olmak","syn":"implement, put into practice; pertain","ex":"The principles of behavioral economics can be **applied** to design more effective public policies that encourage desirable social outcomes.","extr":"Davranışsal ekonomi ilkeleri, arzu edilen toplumsal sonuçları teşvik eden daha etkili kamu politikaları tasarlamak için **uygulanabilir**."},{"n":17,"w":"appraise","tr":"değer biçmek, değerlendirmek","syn":"evaluate, assess, valuate, judge","ex":"The bank sent an expert to **appraise** the house before approving the loan.","extr":"Banka, krediyi onaylamadan önce eve **pahabiçmesi/değerini takdir etmesi** için bir uzman gönderdi."},{"n":18,"w":"appreciate","tr":"takdir etmek, değerini bilmek; anlamak; değer kazanmak","syn":"value, recognize, comprehend","ex":"To fully **appreciate** the complexity of the issue, one must consider the intricate interplay of economic, cultural, and geopolitical factors.","extr":"Konunun karmaşıklığını tam olarak **anlamak** için, ekonomik, kültürel ve jeopolitik faktörlerin karmaşık etkileşimini dikkate almak gerekir."},{"n":19,"w":"arise","tr":"ortaya çıkmak, doğmak, kaynaklanmak","syn":"emerge, originate, appear, stem (from)","ex":"New ethical dilemmas constantly **arise** from advancements in artificial intelligence, demanding continuous philosophical and legal scrutiny.","extr":"Yapay zekadaki ilerlemelerden sürekli olarak yeni etik ikilemler **doğmakta** ve bunlar sürekli felsefi ve hukuki inceleme gerektirmektedir."},{"n":20,"w":"assess","tr":"değerlendirmek, tahmin etmek (zarar/etki vb.), ölçmek","syn":"evaluate, gauge, appraise","ex":"It is difficult to **assess** the full impact of climate change on global biodiversity at this stage.","extr":"Bu aşamada, iklim değişikliğinin küresel biyoçeşitlilik üzerindeki tam etkisini **tahminetmek/değerlendirmek** zordur."},{"n":21,"w":"assign","tr":"atamak, görevlendirmek, tahsis etmek, belirlemek","syn":"allot, designate, allocate","ex":"The United Nations **assigned** a special envoy to handle the crisis.","extr":"Birleşmiş Milletler, krizle ilgilenmesi için özel bir temsilci **görevlendirdi**."},{"n":22,"w":"attain","tr":"elde etmek, ulaşmak, erişmek","syn":"achieve, reach, accomplish","ex":"Sustainable development goals can only be **attained** through a concerted global effort that prioritizes equity and long-term planning over short- term gains.","extr":"Sürdürülebilir kalkınma hedeflerine, ancak kısa vadeli kazançlar yerine eşitliği ve uzun vadeli planlamayı önceliklendiren ortaklaşa bir küresel çabayla **ulaşılabilir**."},{"n":23,"w":"avoid","tr":"kaçınmak, sakınmak, önlemek","syn":"evade, refrain; prevent","ex":"To **avoid** methodological pitfalls, the researchers implemented a double-blind peer review process for data analysis.","extr":"Araştırmacılar, metodolojik tuzaklardan **kaçınmak** için veri analizinde çift-kör bir hakem değerlendirme süreci uyguladı."},{"n":24,"w":"boost","tr":"artırmak, yükseltmek, canlandırmak, desteklemek","syn":"enhance, increase, stimulate, promote","ex":"The strategic partnership was designed to **boost** innovation by facilitating cross disciplinary collaboration and resource sharing.","extr":"Stratejik ortaklık, disiplinler arası işbirliğini ve kaynak paylaşımını kolaylaştırarak inovasyonu **artırmak** amacıyla tasarlandı."},{"n":25,"w":"borrow","tr":"ödünç almak, (dilden/ kültürden) alıntı yapmak","syn":"take on loan; adopt (from)","ex":"Many languages **borrow** technical terms from English, a phenomenon that reflects Anglo-American dominance in science and technology.","extr":"Birçok dil, İngilizceden teknik terimler **ödünç alır**; bu olgu, bilim ve teknolojideki Anglo-Amerikan hakimiyetini yansıtır."},{"n":26,"w":"capture","tr":"yakalamak, ele geçirmek, (dikkat/his) çekmek; yansıtmak","syn":"seize; embody, represent, catch","ex":"The novel brilliantly **captures** the zeitgeist of the post-war era, with its pervasive sense of anxiety and fragmented identities.","extr":"Roman, yaygın bir kaygı duygusu ve parçalanmış kimlikleriyle savaş sonrası dönemin zeitgeist'ını (dönem ruhunu) ustaca **yakalar/yansıtır**."},{"n":27,"w":"carry","tr":"taşımak, (sorumluluk/risk) üstlenmek","syn":"transport; bear","ex":"The title of 'world heritage site' **carries** with it not only prestige but also a significant burden of conservation and management responsibilities.","extr":"Dünya mirası alanı' unvanı, yalnızca prestij değil, aynı zamanda önemli bir koruma ve yönetim sorumluluğu yükü de **taşır**."},{"n":28,"w":"challenge","tr":"meydan okumak, sorgulamak, zorluğa sokmak","syn":"contest, question, dispute","ex":"Recent archaeological findings **challenge** the long held assumption that the civilization declined due to a single catastrophic event.","extr":"Yeni arkeolojik bulgular, uygarlığın tek bir felaket olayı nedeniyle çöktüğüne dair uzun süredir devam eden varsayıma **meydan okumaktadır**."},{"n":29,"w":"compile","tr":"derlemek, toplamak, bir araya getirmek","syn":"collect, assemble, gather, collate","ex":"The team spent months **compiling** a comprehensive dataset from disparate archives to ensure the statistical analysis was robust.","extr":"Ekip, istatistiksel analizin sağlam olmasını sağlamak için dağınık arşivlerden kapsamlı bir veri seti **derlemek** için aylar harcadı."},{"n":30,"w":"complain","tr":"şikayet etmek, yakınmak","syn":"protest, grumble","ex":"Critics **complain** that the proposed legislation, while well-intentioned, creates excessive bureaucratic red tape that could stifle economic initiative.","extr":"Eleştirmenler, önerilen mevzuatın iyi niyetli olmakla birlikte, ekonomik girişimi engelleyebilecek aşırı bürokratik engeller yarattığından **şikayet ediyor**."},{"n":31,"w":"comprehend","tr":"kavramak, anlamak, idrak etmek","syn":"understand, grasp","ex":"Students often fail to **comprehend** the underlying mathematical principles behind complex algorithms.","extr":"Öğrenciler genellikle karmaşık algoritmaların arkasında yatan temel matematiksel prensipleri **anlamakta/idrak etmekte** başarısız olurlar."},{"n":32,"w":"comprise","tr":"kapsamak, oluşmak, -den meydana gelmek","syn":"consist of, include, encompass","ex":"The committee **comprises** experts from a diverse range of disciplines, ensuring a holistic approach to the policy review.","extr":"Komite, politika incelemesine bütüncül bir yaklaşım sağlamak için çok çeşitli disiplinlerden gelen uzmanlar**dan oluşmaktadır**."},{"n":33,"w":"conceal","tr":"gizlemek, saklamak, örtmek","syn":"hide, obscure, disguise","ex":"The official report attempted to **conceal** the extent of the data breach, but investigative journalism soon uncovered the truth.","extr":"Resmi rapor, veri ihlalinin boyutunu **gizlemeye** çalıştı, ancak araştırmacı gazetecilik kısa sürede gerçeği ortaya çıkardı."},{"n":34,"w":"confront","tr":"yüzleşmek, karşı karşıya gelmek, üstüne gitmek","syn":"face, encounter, address","ex":"Societies must **confront** the legacy of historical injustices to achieve genuine reconciliation and build an equitable future.","extr":"Toplumlar, gerçek bir uzlaşı sağlamak ve adil bir gelecek inşa etmek için tarihsel haksızlıkların mirasıyla **yüzleşmelidir**."},{"n":35,"w":"constitute","tr":"oluşturmak, teşkil etmek, -den ibaret olmak","syn":"form, compose, represent","ex":"The rise in unemployment figures **constitutes** a serious threat to the economy.","extr":"İşsizlik rakamlarındaki artış, ekonomi için ciddi bir tehdit **teşkil ediyor**."},{"n":36,"w":"constrain","tr":"kısıtlamak, sınırlamak, zorlamak","syn":"restrict, limit, confine","ex":"Fiscal austerity measures severely **constrained** the government's ability to invest in social programs during the economic downturn.","extr":"Mali kemer sıkma önlemleri, ekonomik durgunluk döneminde hükümetin sosyal programlara yatırım yapma yeteneğini ciddi şekilde **kısıtladı**."},{"n":37,"w":"contact","tr":"temas kurmak, irtibata geçmek, ulaşmak","syn":"get in touch with, reach out to","ex":"Participants in the study were instructed not to **contact** each other during the experiment to prevent cross-contamination of data.","extr":"Çalışmaya katılanlara, verilerin birbirine karışmasını önlemek için deney sırasında birbirleriyle **temas kurmamaları** talimatı verildi."},{"n":38,"w":"contend","tr":"İddia etmek, savunmak; mücadele etmek","syn":"argue, assert; compete","ex":"Some scholars **contend** that the concept of the 'nation-state' is an outdated construct in an increasingly globalized and interconnected world.","extr":"Bazı akademisyenler, 'ulus-devlet' kavramının giderek küreselleşen ve birbirine bağlı bir dünyada modası geçmiş bir yapı olduğunu **iddia etmekted**ir."},{"n":39,"w":"contradict","tr":"çelişmek, aykırı olmak, yalanlamak","syn":"conflict with","ex":"The witness's testimony appeared to **contradict** the physical evidence, casting doubt on the sequence of events.","extr":"Tanığın ifadesi, fiziksel kanıtlarla **çelişiyor** gibiydi ve bu da olayların akışı hakkında şüphe uyandırdı."},{"n":40,"w":"convey","tr":"İletmek, aktarmak, ifade etmek, taşımak","syn":"communicate, express, transport","ex":"The artist's use of stark contrast and symbolism effectively **conveys** a profound sense of existential despair.","extr":"Sanatçının keskin kontrast ve sembolizm kullanımı, varoluşsal bir umutsuzluk hissini etkili bir şekilde **aktarıyor**."},{"n":41,"w":"cover","tr":"kapsamak, kaplamak; (haber) yapmak; (masraf) karşılamak","syn":"include, encompass; report on","ex":"The grant is designed to **cover** all research- related expenses, including fieldwork, equipment, and open-access publication fees.","extr":"Hibe, saha çalışması, ekipman ve açık erişim yayın ücretleri de dahil olmak üzere araştırma ile ilgili tüm masrafları **karşılayacak** şekilde tasarlanmıştır."},{"n":42,"w":"create","tr":"yaratmak, oluşturmak, meydana getirmek","syn":"generate, produce, establish","ex":"The treaty aimed to **create** a framework for international cooperation on cybersecurity, but it has been criticized for lacking enforcement mechanisms.","extr":"Antlaşma, siber güvenlik konusunda uluslararası işbirliği için bir çerçeve **oluşturmayı** amaçlıyordu, ancak yaptırım mekanizmalarından yoksun olduğu için eleştirildi."},{"n":43,"w":"defend","tr":"savunmak, korumak, müdafaa etmek","syn":"protect, safeguard","ex":"The philosopher's task is not merely to interpret ideas but to rigorously **defend** them against logical fallacies and counterarguments.","extr":"Filozofun görevi, yalnızca fikirleri yorumlamak değil, aynı zamanda onları mantık hatalarına ve karşı argümanlara karşı titizlikle **savunmaktır**."},{"n":44,"w":"defy","tr":"meydan okumak, karşı gelmek, baş eğmemek","syn":"resist, challenge, disobey","ex":"The experimental results **defy** conventional explanation, suggesting the existence of a previously unknown physical phenomenon.","extr":"Deneysel sonuçlar, geleneksel açıklamalara **meydan okuyarak** daha önce bilinmeyen bir fiziksel fenomenin varlığına işaret ediyor."},{"n":45,"w":"demand","tr":"talep etmek, istemek, gerektirmek","syn":"require, insist on, call for","ex":"The scale of modern cyber threats **demands** continuous adaptation of security protocols.","extr":"Modern siber tehditlerin ölçeği güvenlik protokollerinin sürekli uyarlanmasını **gerektirir**."},{"n":46,"w":"deny","tr":"reddetmek, yalanlamak, inkar etmek, (erişim/vize) vermemek","syn":"refute, reject, contradict","ex":"**Denying** individuals access to basic healthcare constitutes a violation of fundamental rights.","extr":"Bireylerin temel sağlık hizmetlerine erişimini **reddetmek** temel hakların ihlalini teşkil eder."},{"n":47,"w":"depict","tr":"betimlemek, tasvir etmek, göstermek","syn":"portray, illustrate, represent","ex":"The documentary powerfully **depicts** the human cost of the conflict, focusing on individual stories rather than geopolitical analysis.","extr":"Belgesel, çatışmanın insani bedelini jeopolitik analizlerden ziyade bireysel hikayelere odaklanarak güçlü bir şekilde **betimliyor**."},{"n":48,"w":"deplete","tr":"tüketmek, azaltmak, bitirmek","syn":"exhaust, drain, consume","ex":"Unsustainable fishing practices are rapidly **depleting** fish stocks, threatening both marine ecosystems and the livelihoods of coastal communities.","extr":"Sürdürülebilir olmayan balıkçılık uygulamaları, balık stoklarını hızla **tüketerek** hem deniz ekosistemlerini hem de kıyı topluluklarının geçim kaynaklarını tehdit ediyor."},{"n":49,"w":"destroy","tr":"yok etmek, tahrip etmek, imha etmek","syn":"demolish, ruin, annihilate","ex":"The leaked confidential files could **destroy** the company's reputation and expose it to significant legal liability.","extr":"Sızdırılan gizli dosyalar, şirketin itibarını **yokedebilir** ve onu önemli yasal sorumluluğa maruz bırakabilir."},{"n":50,"w":"destruct","tr":"(kendini) imha etmek, yok olmak","syn":"self-destruct, disintegrate","ex":"The missile is programmed to **destruct** automatically if it deviates from its pre-approved flight path, as a safety precaution.","extr":"Füze, bir güvenlik önlemi olarak, önceden onaylanmış uçuş yolundan saparsa otomatik olarak **kendini imha etmek** üzere programlanmıştır."},{"n":51,"w":"detect","tr":"tespit etmek, algılamak, farkına varmak","syn":"discover, identify, sense","ex":"Advanced spectroscopic analysis can **detect** trace amounts of organic compounds in Martian soil, providing clues about the planet's past habitability.","extr":"Gelişmiş spektroskopik analiz, Mars toprağındaki eser miktardaki organik bileşikleri **tespit edebilir** ve gezegenin geçmişteki yaşanabilirliği hakkında ipuçları sağlayabilir."},{"n":52,"w":"deter","tr":"caydırmak, vazgeçirmek, engellemek","syn":"discourage, prevent, dissuade","ex":"The primary purpose of severe penalties is to **deter** potential offenders, though their effectiveness as a long term crime reduction strategy is widely debated.","extr":"Ağır cezaların temel amacı potansiyel suçluları **caydırmak** olsa da, bunların uzun vadeli bir suç azaltma stratejisi olarak etkinliği geniş çapta tartışılmaktadır."},{"n":53,"w":"deteriorate","tr":"kötüleşmek, bozulmak, aşınmak","syn":"worsen, decline, degenerate","ex":"Without immediate intervention, diplomatic relations between the two nations could rapidly **deteriorate**, leading to a renewed cycle of hostility.","extr":"Acil müdahale olmadan, iki ulus arasındaki diplomatik ilişkiler hızla **kötüleşebilir** ve yeni bir düşmanlık döngüsüne yol açabilir."},{"n":54,"w":"determine","tr":"belirlemek, saptamak, kararlaştırmak","syn":"ascertain, decide, establish","ex":"Genetic markers can help **determine** an individual's predisposition to certain hereditary conditions, enabling proactive healthcare measures.","extr":"Genetik belirteçler, bir bireyin belirli kalıtsal durumlara yatkınlığını **belirlemeye** yardımcı olarak proaktif sağlık önlemlerini mümkün kılabilir."},{"n":55,"w":"diminish","tr":"azaltmak, küçültmek, zayıflatmak","syn":"reduce, decrease, lessen","ex":"The credibility of the institution was severely **diminished** by the scandal, eroding public trust that had taken decades to build.","extr":"Kurumun itibarı, skandal nedeniyle ciddi şekilde **zedelendi/azaldı** ve onlarca yılda inşa edilen kamu güvenini aşındırdı."},{"n":56,"w":"dispel","tr":"dağıtmak, gidermek, yok etmek (şüphe/yanlış inanç)","syn":"eliminate, scatter, dismiss","ex":"The primary goal of the public awareness campaign was to **dispel** widespread myths about vaccine safety using clear, evidence-based communication.","extr":"Kamuoyunu bilinçlendirme kampanyasının temel amacı, aşı güvenliği hakkındaki yaygın mitleri, açık ve kanıta dayalı iletişim kullanarak **gidermekti**."},{"n":57,"w":"disperse","tr":"dağıtmak, yaymak, serpmek","syn":"scatter, disseminate, spread","ex":"Police used non-lethal means to **disperse** the crowd after the protest was declared an unlawful assembly.","extr":"Polis, protesto yasa dışı bir toplantı ilan edildikten sonra kalabalığı **dağıtmak** için ölümcül olmayan araçlar kullandı."},{"n":58,"w":"display","tr":"sergilemek, göstermek, ortaya koymak","syn":"exhibit, show, demonstrate","ex":"Children exposed to chronic stress often **display** heightened emotional reactivity.","extr":"Kronik strese maruz kalan çocuklar sıklıkla artmış duygusal tepkisellik **sergiler**."},{"n":59,"w":"disrupt","tr":"aksatmak, bozmak, sekteye uğratmak","syn":"interrupt, disturb, upset","ex":"Emerging technologies have the potential to **disrupt** entire industries, rendering traditional business models obsolete.","extr":"Yeni teknolojiler, geleneksel iş modellerini geçersiz kılarak tüm endüstrileri **altüst etme** potansiyeline sahiptir."},{"n":60,"w":"dissolve","tr":"erimek, çözmek, çözülmek; dağıtmak, (parlamento/birlik) feshetmek","syn":"melt; terminate, disband","ex":"The coalition government was **dissolved** following the failure to reach a consensus on the critical budget bill, triggering a snap election.","extr":"Koalisyon hükümeti, kritik bütçe tasarısı üzerinde fikir birliğine varılamamasının ardından **feshedildi** ve erken seçimleri tetikledi."},{"n":61,"w":"distinguish","tr":"ayırt etmek, fark görmek, seçmek","syn":"differentiate, discern, set apart","ex":"A critical thinker must be able to **distinguish** between empirical evidence and mere anecdote or opinion.","extr":"Eleştirel bir düşünür, ampirik kanıt ile sadece anekdot veya görüş arasında **ayırım yapabilmelidir**."},{"n":62,"w":"distribute","tr":"dağıtmak, paylaştırmak, bölüştürmek","syn":"disperse, allot","ex":"The challenge lies not only in producing enough vaccines but also in creating a logistical network to equitably **distribute** them globally.","extr":"Zorluk, yalnızca yeterli aşı üretmekte değil, aynı zamanda onları küresel olarak adil bir şekilde **dağıtmak** için lojistik bir ağ oluşturmaktadır."},{"n":63,"w":"disturb","tr":"rahatsız etmek, bozmak, altüst etmek","syn":"disrupt, bother, upset","ex":"Sleep deprivation **disturbs** cognitive functioning and decision-making processes.","extr":"Uykusuzluk bilişsel işlevleri ve karar verme süreçlerini **bozar**."},{"n":64,"w":"earn","tr":"kazanmak, kazandırmak, elde etmek","syn":"gain, deserve, obtain","ex":"Her groundbreaking research on neural plasticity has **earned** her the respect of peers and several prestigious awards.","extr":"Nöral plastisite üzerine yaptığı çığır açıcı araştırma, ona meslektaşlarının saygısını ve birkaç prestijli ödül **kazandırdı**."},{"n":65,"w":"elaborate","tr":"ayrıntılandırmak, detaylandırmak, üzerinde durmak","syn":"expand on","ex":"The author uses the first chapter to **elaborate** on the methodological framework that will underpin the entire analysis.","extr":"Yazar, tüm analizin altında yatan metodolojik çerçeveyi **ayrıntılandırmak** için ilk bölümü kullanıyor."},{"n":66,"w":"eliminate","tr":"ortadan kaldırmak, elemek, yok etmek","syn":"eradicate, remove, abolish","ex":"The new protocol aims to **eliminate** systemic bias from the hiring process through structured interviews and blind portfolio reviews.","extr":"Yeni protokol, yapılandırılmış mülakatlar ve kör portföy incelemeleri yoluyla işe alım sürecindeki sistematik önyargıyı **ortadan kaldırmayı** amaçlıyor."},{"n":67,"w":"elucidate","tr":"açıklamak, aydınlatmak, netleştirmek","syn":"clarify, explain, illuminate","ex":"The professor used a series of complex diagrams to **elucidate** the intricate biochemical pathways involved in cellular respiration.","extr":"Profesör, hücresel solunumda yer alan karmaşık biyokimyasal yolları **aydınlatmak** için bir dizi karmaşık diyagram kullandı."},{"n":68,"w":"embody","tr":"somutlaştırmak, cisimlendirmek, kişileştirmek","syn":"personify, represent","ex":"Modern smartphones **embody** the convergence of communication, computing, and entertainment technologies.","extr":"Modern akıllı telefonlar iletişim, bilişim ve eğlence teknolojilerinin birleşimini **somutlaştırır**."},{"n":69,"w":"embrace","tr":"benimsemek, kucaklamak, içine almak","syn":"adopt, welcome, encompass","ex":"Companies that **embrace** diversity and inclusion tend to be more innovative and resilient in the face of market changes.","extr":"Çeşitliliği ve kapsayıcılığı **benimseyen** şirketler, pazar değişiklikleri karşısında daha yenilikçi ve dayanıklı olma eğilimindedir."},{"n":70,"w":"emerge","tr":"ortaya çıkmak, belirmek, meydana gelmek","syn":"appear, arise, come forth","ex":"A clear pattern began to **emerge** from the data, suggesting a strong correlation between investment in early education and long-term economic mobility.","extr":"Verilerden, erken eğitime yapılan yatırım ile uzun vadeli ekonomik hareketlilik arasında güçlü bir korelasyon olduğunu gösteren net bir model **ortayaçıkmaya** başladı."},{"n":71,"w":"enact","tr":"yürürlüğe koymak, çıkarmak (kanun), oynamak (rol)","syn":"implement, pass, legislate","ex":"The parliament voted to **enact** stricter environmental regulations, signaling a major shift in the country's climate policy.","extr":"Parlamento, ülkenin iklim politikasında büyük bir değişimin sinyalini vererek daha katı çevre düzenlemelerini **yürürlüğe koymak** için oy kullandı."},{"n":72,"w":"encompass","tr":"kapsamak, içermek, kuşatmak","syn":"include, comprise, embrace","ex":"The term 'digital humanities' **encompasses** a wide range of interdisciplinary practices that apply computational tools to traditional humanistic inquiry.","extr":"Dijital beşeri bilimler' terimi, geleneksel beşeri bilim araştırmalarına hesaplamalı araçlar uygulayan çok çeşitli disiplinler arası uygulamaları **kapsar**."},{"n":73,"w":"endorse","tr":"onaylamak, desteklemek, arka çıkmak","syn":"support, approve, advocate for","ex":"The influential journal's decision to **endorse** the study's findings lent them significant credibility within the academic community.","extr":"Etkili derginin, çalışmanın bulgularını **onaylama** kararı, onlara akademik camiada önemli bir güvenilirlik kazandırdı."},{"n":74,"w":"enforce","tr":"uygulamak (kanun), yürütmek, zorla kabul ettirmek","syn":"implement, impose, administer","ex":"A law is only as effective as the institutional capacity to **enforce** it consistently and without bias.","extr":"Bir yasa, onu tutarlı ve önyargısız bir şekilde **uygulayacak** kurumsal kapasite kadar etkilidir."},{"n":75,"w":"engage","tr":"ilgisini çekmek, bağlamak, dahil etmek; meşgul etmek","syn":"involve, participate, occupy","ex":"Governments must **engage** citizens in decision- making processes to strengthen democratic legitimacy.","extr":"Hükümetler demokratik meşruiyeti güçlendirmek için vatandaşları karar alma süreçlerine **dâhiletmelidir**."},{"n":76,"w":"enhance","tr":"geliştirmek, artırmak, iyileştirmek","syn":"improve, boost, augment","ex":"Strategic public investment in infrastructure is proven to **enhance** long-term economic productivity and regional competitiveness.","extr":"Altyapıya yapılan stratejik kamu yatırımının, uzun vadeli ekonomik verimliliği ve bölgesel rekabet gücünü **artırdığı** kanıtlanmıştır."},{"n":77,"w":"ensure","tr":"sağlamak, garantiye almak, temin etmek","syn":"guarantee, secure, make certain","ex":"Rigorous peer-review processes are essential to **ensure** the integrity and reliability of published scientific research.","extr":"Katı hakem değerlendirme süreçleri, yayınlanan bilimsel araştırmaların bütünlüğünü ve güvenilirliğini **sağlamak** için esastır."},{"n":78,"w":"eradicate","tr":"kökünden kazımak, yok etmek, ortadan kaldırmak","syn":"eliminate, annihilate, wipe out","ex":"Global health initiatives have made significant progress toward the goal to **eradicate** polio, though the final stages present unique logistical challenges.","extr":"Küresel sağlık girişimleri, çocuk felcini **kökündenkazıma** hedefinde önemli ilerleme kaydetmiştir, ancak son aşamalar benzersiz lojistik zorluklar sunmaktadır."},{"n":79,"w":"estimate","tr":"tahmin etmek, değer biçmek, kestirmek","syn":"approximate, gauge, assess","ex":"Economists **estimate** the potential economic fallout from the trade dispute to be in the range of several percentage points of GDP.","extr":"Ekonomistler, ticaret anlaşmazlığının potansiyel ekonomik etkisini, GSYİH'nın birkaç puanlık aralığında olacak şekilde **tahmin ediyor**."},{"n":80,"w":"evaluate","tr":"değerlendirmek, incelemek, ölçmek","syn":"assess, appraise, judge","ex":"The board will **evaluate** the CEO's performance based on a comprehensive set of metrics, including financial results, innovation, and employee satisfaction.","extr":"Yönetim kurulu, CEO'nun performansını, finansal sonuçlar, inovasyon ve çalışan memnuniyeti dahil olmak üzere kapsamlı bir metrik setine göre **değerlendirecek**."},{"n":81,"w":"examine","tr":"incelemek, muayene etmek, araştırmak","syn":"inspect, scrutinize, analyze","ex":"The study will **examine** the long-term effects of social media usage on adolescent mental health.","extr":"Çalışma, sosyal medya kullanımının ergen ruh sağlığı üzerindeki uzun vadeli etkilerini **inceleyecek**."},{"n":82,"w":"exceed","tr":"aşmak, geçmek, üstüne çıkmak","syn":"surpass, outstrip, transcend","ex":"Companies that **exceed** legally permitted emission limits face substantial financial penalties.","extr":"Yasal olarak izin verilen emisyon sınırlarını **aşan** şirketler ciddi mali yaptırımlarla karşı karşıya kalır."},{"n":83,"w":"exclude","tr":"hariç tutmak, dışlamak, dahil etmemek","syn":"omit, leave out, bar","ex":"Historians caution against studies that **exclude** the perspectives of marginalized groups, as they risk producing a distorted historical narrative.","extr":"Tarihçiler, marjinal grupların bakış açılarını **dışlayan** çalışmalara karşı uyarıyor, çünkü bunlar çarpık bir tarihsel anlatı üretme riski taşıyor."},{"n":84,"w":"execute","tr":"uygulamak, yerine getirmek, infaz etmek","syn":"carry out, implement, perform","ex":"The success of the strategic plan hinges on the organization's ability to **execute** it with precision and adapt to unforeseen challenges.","extr":"Stratejik planın başarısı, organizasyonun onu hassasiyetle **uygulama** ve öngörülemeyen zorluklara uyum sağlama yeteneğine bağlıdır."},{"n":85,"w":"exert","tr":"uygulamak (kuvvet/baskı), sarf etmek (çaba), göstermek (etki)","syn":"apply, exercise, wield","ex":"Superpowers **exert** considerable influence over global economic institutions, often shaping rules to favor their own interests.","extr":"Süper güçler, genellikle kuralları kendi çıkarları doğrultusunda şekillendirerek küresel ekonomik kurumlar üzerinde önemli bir etki **uygularlar**."},{"n":86,"w":"expand","tr":"genişletmek, büyütmek, yaymak","syn":"enlarge, extend, amplify","ex":"The company aims to **expand** its market share by leveraging data analytics to personalize customer experiences at an unprecedented scale.","extr":"Şirket, müşteri deneyimlerini benzeri görülmemiş bir ölçekte kişiselleştirmek için veri analitiğinden yararlanarak pazar payını **genişletmeyi** amaçlıyor."},{"n":87,"w":"exploit","tr":"sömürmek; istismar etmek; (fırsat/kaynak) azami derecede kullanmak","syn":"take advantage of, utilize, harness","ex":"Some plants **exploit** symbiotic relationships with fungi to obtain more nutrients and water from the soil.","extr":"Bazı bitkiler, topraktan daha fazla besin ve su almak için mantarlarla olan simbiyotik ilişkilerden **yararlanır**."},{"n":88,"w":"expose","tr":"açığa çıkarmak, maruz bırakmak, teşhir etmek","syn":"reveal, uncover, subject","ex":"The documentary aims to **expose** the hidden environmental costs of fast fashion, such as water pollution and waste.","extr":"Belgesel, hızlı modanın su kirliliği ve atık gibi gizli çevresel maliyetlerini **açığa çıkarmayı** amaçlıyor."},{"n":89,"w":"facilitate","tr":"kolaylaştırmak, aracılık etmek, olanak sağlamak","syn":"ease, enable, promote","ex":"Digital platforms **facilitate** instantaneous global communication but also raise complex questions about data privacy and misinformation.","extr":"Dijital platformlar, anlık küresel iletişimi **kolaylaştırır** ancak aynı zamanda veri gizliliği ve dezenformasyon hakkında karmaşık soruları da gündeme getirir."},{"n":90,"w":"fail","tr":"başarısız olmak, bozulmak, yapmamak (görev), iflas etmek","syn":"be unsuccessful, break down, neglect","ex":"The state is argued to have **failed** in its most basic duty when it cannot protect its citizens from widespread violence and lawlessness.","extr":"Devletin, vatandaşlarını yaygın şiddet ve kanunsuzluktan koruyamadığında en temel görevinde **başarısız olduğu** ileri sürülmektedir."},{"n":91,"w":"foresee","tr":"öngörmek, önceden görmek, tahmin etmek","syn":"predict, anticipate, envisage","ex":"Good urban planners try to **foresee** future transportation needs and design cities accordingly","extr":"İyi şehir plancıları, geleceğin ulaşım ihtiyaçlarını **önceden görmeye** ve şehirleri buna göre tasarlamaya çalışır."},{"n":92,"w":"fortify","tr":"güçlendirmek, tahkim etmek, takviye etmek","syn":"strengthen, reinforce, bolster","ex":"The country moved to **fortify** its cyber defenses in response to an escalating series of state-sponsored attacks on critical infrastructure.","extr":"Ülke, kritik altyapıya yönelik devlet destekli saldırıların artan sayısına karşılık olarak siber savunmalarını **güçlendirmek** için harekete geçti."},{"n":93,"w":"foster","tr":"teşvik etmek, geliştirmek, beslemek; evlat edinmek","syn":"encourage, promote, nurture","ex":"A supportive home environment can **foster** a child's emotional resilience and self-confidence.","extr":"Destekleyici bir ev ortamı, bir çocuğun duygusal dayanıklılığını ve özgüvenini **geliştirebilir**."},{"n":94,"w":"found","tr":"kurmak, temelini atmak, dayandırmak","syn":"establish, institute, base","ex":"Einstein's theory of relativity **is founded on** the principle that the laws of physics are the same for all observers.","extr":"Einstein'ın görelilik teorisi, fizik yasalarının tüm gözlemciler için aynı olduğu ilkesi **üzerine kuruludur**."},{"n":95,"w":"fulfil","tr":"yerine getirmek (söz/vaad), tatmin etmek, karşılamak (şart)","syn":"accomplish, satisfy, meet","ex":"The new policy package aims to **fulfil** the government's dual promises of economic stimulus and environmental sustainability.","extr":"Yeni politika paketi, hükümetin ekonomik teşvik ve çevresel sürdürülebilirlik vaatlerini **yerinegetirmeyi** amaçlıyor."},{"n":96,"w":"glide","tr":"süzülmek, kaymak, zahmetsizce hareket etmek","syn":"slide, drift","ex":"Certain birds, like albatrosses, can **glide** for hours over the ocean without flapping their wings, using air currents to stay aloft.","extr":"Albatros gibi bazı kuşlar, havada kalmak için hava akımlarını kullanarak, kanatlarını çırpmadan okyanus üzerinde saatlerce **süzülebilir**."},{"n":97,"w":"halt","tr":"durdurmak, son vermek, durmak","syn":"stop, cease, arrest","ex":"Economic sanctions were imposed to **halt** the country's illegal trade activities and force diplomatic negotiations.","extr":"Ülkenin yasa dışı ticaret faaliyetlerini **sonaerdirmek** ve diplomatik müzakereleri zorlamak için ekonomik yaptırımlar uygulandı."},{"n":98,"w":"hamper","tr":"engel olmak, aksatmak, zorlaştırmak","syn":"hinder, impede, obstruct","ex":"The research was severely **hampered** by a lack of access to primary sources, which remained classified for national security reasons.","extr":"Araştırma, ulusal güvenlik gerekçesiyle gizli kalan birincil kaynaklara erişim eksikliği nedeniyle ciddi şekilde **aksatıldı**."},{"n":99,"w":"handle","tr":"ele almak, idare etmek, başa çıkmak, işlemek","syn":"manage, deal with, cope with","ex":"The crisis revealed whether institutions were robust enough to **handle** a simultaneous shock to both public health and the global economy.","extr":"Kriz, kurumların hem kamu sağlığına hem de küresel ekonomiye yönelik eşzamanlı bir şokla **başaçıkmaya** yetecek kadar sağlam olup olmadığını ortaya çıkardı."},{"n":100,"w":"harvest","tr":"hasat etmek, toplamak, (veri/bilgi) elde etmek","syn":"reap, gather, collect","ex":"Modern agriculture uses sensors and AI to optimize irrigation and precisely **harvest** crops, maximizing yield while conserving resources.","extr":"Modern tarım, sulamayı optimize etmek ve ürünleri tam olarak **hasat etmek** için sensörler ve yapay zeka kullanarak kaynakları korurken verimi en üst düzeye çıkarıyor."},{"n":101,"w":"highlight","tr":"vurgulamak, öne çıkarmak, altını çizmek","syn":"emphasize, underscore, spotlight","ex":"The recent study's findings **highlight** the critical link between sleep quality and cognitive performance in adults.","extr":"Yakın zamandaki araştırmanın bulguları, yetişkinlerde uyku kalitesi ile bilişsel performans arasındaki kritik bağlantıyı **vurgulamaktadır**."},{"n":102,"w":"hinder","tr":"engel olmak, yavaşlatmak, aksatmak","syn":"impede, hamper, obstruct","ex":"Bureaucratic inertia and complex regulatory frameworks can significantly **hinder** innovation in emerging technological sectors.","extr":"Bürokratik atalet ve karmaşık düzenleyici çerçeveler, gelişmekte olan teknolojik sektörlerdeki inovasyonu önemli ölçüde **engelleyebilir**."},{"n":103,"w":"identify","tr":"tanımlamak, tespit etmek, belirlemek, özdeşleştirmek","syn":"recognize, pinpoint, ascertain","ex":"Researchers were able to **identify** a specific genetic marker that is strongly correlated with increased resilience to neurodegenerative diseases.","extr":"Araştırmacılar, nörodejeneratif hastalıklara karşı artan dirençle güçlü bir şekilde ilişkilendirilen spesifik bir genetik belirteç **tespit edebildiler**."},{"n":104,"w":"impact","tr":"etkilemek, etki yapmak; çarpmak","syn":"affect, influence; hit","ex":"Policymakers are struggling to assess how automation will **impact** employment patterns and social stability in the coming decades.","extr":"Politika yapıcılar, otomasyonun önümüzdeki on yıllarda istihdam modellerini ve sosyal istikrarı nasıl **etkileyeceğini** değerlendirmekte zorlanıyor."},{"n":105,"w":"impair","tr":"zayıflatmak, bozmak, engellemek","syn":"weaken, diminish, hinder","ex":"Chronic sleep deprivation can severely **impair** cognitive function, including memory consolidation and decision-making abilities.","extr":"Kronik uyku yoksunluğu, hafıza birleştirme ve karar verme yetenekleri de dahil olmak üzere bilişsel işlevi ciddi şekilde **bozabilir**."},{"n":106,"w":"imply","tr":"ima etmek, anlamına gelmek","syn":"suggest, indicate, hint","ex":"The unusual orbit of the object **implies** the existence of a previously unknown gravitational influence, possibly a hidden planet.","extr":"Cismin olağandışı yörüngesi, daha önce bilinmeyen bir kütleçekimsel etkinin, muhtemelen gizli bir gezegenin varlığını **göstermektedir**."},{"n":107,"w":"impose","tr":"dayatmak, yüklemek, zorla kabul ettirmek, (yaptırım) uygulamak","syn":"enforce, inflict","ex":"The central bank may **impose** capital controls to stabilize the national currency and prevent a sudden flight of foreign investment.","extr":"Merkez bankası, ulusal para birimini istikrara kavuşturmak ve yabancı yatırımın ani bir şekilde çekilmesini önlemek için sermaye kontrolleri **dayatabilir**."},{"n":108,"w":"indicate","tr":"işaret etmek, göstermek, belirtmek","syn":"show, signal, point to","ex":"Early polling data **indicates** a significant shift in public opinion, though it remains volatile ahead of the election.","extr":"Erken anket verileri, kamuoyunda önemli bir değişime **işaret etse** de, bu değişim seçim öncesinde değişkenliğini koruyor."},{"n":109,"w":"induce","tr":"neden olmak, yol açmak, başlatmak; ikna ederek sağlamak","syn":"cause, bring about, prompt","ex":"Certain medications can **induce** drowsiness as a side effect, so patients are advised not to drive after taking them.","extr":"Bazı ilaçlar yan etki olarak uyku hali **tetikleyebilir**, bu nedenle hastaların bu ilaçları aldıktan sonra araç kullanmamaları önerilir."},{"n":110,"w":"infiltrate","tr":"sızmak, içine nüfuz etmek, arasına karışmak","syn":"penetrate, permeate","ex":"Counter-intelligence agencies work to prevent hostile actors from attempting to **infiltrate** critical government networks and steal sensitive data.","extr":"Karşı istihbarat ajansları, düşman aktörlerin kritik devlet ağlarına **sızıp** hassas verileri çalmaya çalışmasını önlemek için çalışır."},{"n":111,"w":"initiate","tr":"başlatmak, başlatan olmak, girişimde bulunmak","syn":"begin, commence, start","ex":"The university plans to **initiate** a multidisciplinary research program to explore the ethical dimensions of artificial general intelligence.","extr":"Üniversite, yapay genel zekanın etik boyutlarını araştırmak için disiplinler arası bir araştırma programı **başlatmayı** planlıyor."},{"n":112,"w":"inquire","tr":"sormak, soruşturmak, araştırmak","syn":"ask, investigate, query","ex":"The committee has the authority to **inquire into** allegations of misconduct and recommend appropriate disciplinary actions.","extr":"Komitenin, yolsuzluk iddialarını **soruşturma** ve uygun disiplin eylemlerini tavsiye etme yetkisi vardır."},{"n":113,"w":"install","tr":"kurmak, monte etmek, yerleştirmek, (makamına) getirmek","syn":"set up, establish; inaugurate","ex":"The new government's first action was to **install** a technocratic cabinet to address the severe economic crisis.","extr":"Yeni hükümetin ilk eylemi, ağır ekonomik krizle başa çıkmak için teknokratik bir kabineyi **görevegetirmek** oldu."},{"n":114,"w":"interpret","tr":"yorumlamak, anlam vermek; çevirmek, tercüme etmek (sözlü olarak)","syn":"explain; translate","ex":"Historians often debate how to **interpret** archival silence—the absence of evidence about certain groups or events.","extr":"Tarihçiler, arşiv sessizliğini—belirli gruplar veya olaylar hakkında kanıt eksikliğini—nasıl **yorumlayacaklarını** sık sık tartışırlar."},{"n":115,"w":"interrupt","tr":"yarıda kesmek, sözünü kesmek, aksatmak","syn":"disrupt, cut off, break off","ex":"Construction activities near the nesting site can **interrupt** the birds' breeding cycle and reduce their population.","extr":"Yuvalama alanı yakınındaki inşaat faaliyetleri, kuşların üreme döngüsünü **bölebilir** ve popülasyonlarını azaltabilir."},{"n":116,"w":"jeopardise","tr":"tehlikeye atmak, riske sokmak","syn":"endanger, imperil, threaten","ex":"Revealing the source's identity would **jeopardise** not only the ongoing investigation but also the safety of individuals involved.","extr":"Kaynağın kimliğini açığa çıkarmak, yalnızca devam eden soruşturmayı değil, aynı zamanda ilgili kişilerin güvenliğini de **tehlikeye atar**."},{"n":117,"w":"justify","tr":"haklı çıkarmak, mazeret göstermek, gerekçelendirmek","syn":"explain, defend, rationalize","ex":"The potential economic benefits of the mining project do not **justify** the irreversible damage it would cause to the ecosystem.","extr":"Maden projesinin potansiyel ekonomik faydaları, ekosisteme vereceği geri dönüşü olmayan zararı **haklıçıkarmamaktadır**."},{"n":118,"w":"launch","tr":"başlatmak; piyasaya sürmek; fırlatmak (roket vb.)","syn":"initiate, introduce, commence","ex":"The company is preparing to **launch** a bold new initiative that aims to make its entire supply chain carbon-neutral within a decade.","extr":"Şirket, tüm tedarik zincirini bir on yıl içinde karbon nötr hale getirmeyi amaçlayan cesur bir yeni girişimi **başlatmaya** hazırlanıyor."},{"n":119,"w":"lessen","tr":"azaltmak, hafifletmek, küçültmek","syn":"reduce, diminish, decrease","ex":"Diplomatic engagement is crucial to **lessen** regional tensions and prevent the conflict from escalating into a wider war.","extr":"Diplomatik angajman, bölgesel gerilimleri **azaltmak** ve çatışmanın daha geniş bir savaşa dönüşmesini önlemek için çok önemlidir."},{"n":120,"w":"maintain","tr":"sürdürmek, korumak, devam ettirmek; bakımını yapmak","syn":"sustain, preserve","ex":"A key challenge for democracies is to **maintain** a balance between national security imperatives and the protection of civil liberties.","extr":"Demokrasiler için önemli bir zorluk, ulusal güvenlik gereklilikleri ile sivil özgürlüklerin korunması arasında bir denge **korumaktır**."},{"n":121,"w":"measure","tr":"ölçmek, değerlendirmek; bir ölçüde olmak","syn":"gauge, assess, quantify","ex":"It is difficult to **measure** the true cultural impact of a social movement, as its influence often permeates society in subtle and diffuse ways.","extr":"Bir sosyal hareketin gerçek kültürel etkisini **ölçmek** zordur, çünkü etkisi genellikle topluma incelikli ve yayılmış şekillerde nüfuz eder."},{"n":122,"w":"mitigate","tr":"hafifletmek, yumuşatmak, etkisini azaltmak","syn":"alleviate, lessen, moderate","ex":"Investing in coastal resilience infrastructure is essential to **mitigate** the effects of rising sea levels and increasingly severe storms.","extr":"Yükselen deniz seviyelerinin ve giderek şiddetlenen fırtınaların etkilerini **hafifletmek** için kıyı dayanıklılık altyapısına yatırım yapmak esastır."},{"n":123,"w":"navigate","tr":"yön bulmak, yönlendirmek, başarıyla ilerlemek","syn":"steer, manoeuvre","ex":"Modern autonomous vehicles use a combination of sensors and GPS to **navigate** through complex urban environments without human input.","extr":"Modern otonom araçlar, insan müdahalesi olmadan karmaşık kentsel ortamlarda **yön bulmak** için sensörler ve GPS kombinasyonunu kullanır."},{"n":124,"w":"necessitate","tr":"gerektirmek, zorunlu kılmak","syn":"require, demand, call for, compel","ex":"The sheer scale of the humanitarian crisis may **necessitate** an unprecedented level of international cooperation and resource mobilization.","extr":"İnsani krizin salt büyüklüğü, benzeri görülmemiş bir uluslararası işbirliği ve kaynak seferberliği düzeyini **gerektirebilir**."},{"n":125,"w":"neglect","tr":"ihmal etmek, göz ardı etmek, bakmamak","syn":"ignore, disregard, overlook","ex":"Patients with certain eating disorders may **neglect** their nutritional needs, resulting in severe vitamin deficiencies and long-term health complications.","extr":"Bazı yeme bozukluğu olan hastalar, beslenme ihtiyaçlarını **ihmal edebilir** ve bu da ciddi vitamin eksikliklerine ve uzun vadeli sağlık sorunlarına yol açabilir."},{"n":126,"w":"nurture","tr":"beslemek, geliştirmek, yetiştirmek","syn":"foster, cultivate, encourage","ex":"Specialized programs in schools aim to **nurture** gifted students' talents and help them reach their full academic potential.","extr":"Okullardaki özel programlar, üstün yetenekli öğrencilerin yeteneklerini **beslemeyi** ve onların tam akademik potansiyellerine ulaşmalarına yardımcı olmayı amaçlar."},{"n":127,"w":"obstruct","tr":"engel olmak, tıkamak, engellemek","syn":"block, impede, hinder","ex":"Political polarization can **obstruct** the legislative process, leading to gridlock even on issues with broad public support.","extr":"Politik kutuplaşma, geniş kamuoyu desteği olan konularda bile tıkanıklığa yol açarak yasama sürecini **engelleyebilir**."},{"n":128,"w":"obtain","tr":"elde etmek, edinmek","syn":"acquire, gain, get","ex":"To conduct a rigorous meta-analysis, researchers must first **obtain** and synthesize data from all relevant published and unpublished studies.","extr":"Titiz bir meta-analiz yürütmek için araştırmacılar, önce ilgili tüm yayınlanmış ve yayınlanmamış çalışmalardan veri elde **etmeli** ve sentezlemelidir."},{"n":129,"w":"occupy","tr":"işgal etmek, meşgul etmek, (zaman/mekan) kaplamak","syn":"inhabit, take up; engage","ex":"The question of ethical responsibility continues to **occupy** a central place in debates about autonomous weapons systems.","extr":"Etik sorumluluk sorusu, otonom silah sistemleri hakkındaki tartışmalarda merkezi bir yer **işgal etmeye** devam ediyor."},{"n":130,"w":"occur","tr":"meydana gelmek, olmak, ortaya çıkmak","syn":"happen, take place, arise","ex":"A chemical reaction will **occur** when the reactant molecules collide with sufficient energy to break existing bonds.","extr":"Reaktan molekülleri, mevcut bağları kırmak için yeterli enerjiyle çarpıştığında bir kimyasal reaksiyon **meydana gelecektir**."},{"n":131,"w":"offer","tr":"sunmak, teklif etmek, sağlamak","syn":"provide, present, propose","ex":"Comparative linguistics **offers** valuable insights into human migration patterns by tracing the divergence and convergence of language families over millennia.","extr":"Karşılaştırmalı dilbilim, dil ailelerinin bin yıllar boyunca ayrılma ve birleşmelerini izleyerek insan göç modelleri hakkında değerli içgörüler **sunar**."},{"n":132,"w":"operate","tr":"işletmek, çalıştırmak; çalışmak, faaliyet göstermek; ameliyat etmek","syn":"function, run, work","ex":"Nuclear power plants **operate** by using the heat from nuclear fission to generate steam, which then drives turbines to produce electricity.","extr":"Nükleer santraller, elektrik üretmek için türbinleri çalıştıran buharı oluşturmak amacıyla nükleer fisyon ısısını kullanarak **çalışır**."},{"n":133,"w":"overcome","tr":"üstesinden gelmek, yenmek, aşmak","syn":"surmount, conquer, defeat","ex":"The peace process faced formidable obstacles, but sustained diplomatic efforts eventually managed to **overcome** decades of mutual distrust.","extr":"Barış süreci zorlu engellerle karşılaştı, ancak sürekli diplomatik çabalar sonunda on yıllar süren karşılıklı güvensizliğin **üstesinden gelmeyi** başardı."},{"n":134,"w":"overlook","tr":"gözden kaçırmak, ihmal etmek; nazır olmak (manzara)","syn":"miss, neglect, disregard","ex":"City planners cannot **overlook** the needs of pedestrians and cyclists when designing new transportation systems.","extr":"Geleneksel ekonomik modeller, genellikle ekosistem hizmetlerinin içsel değerini gözden kaçırır ve onları hayati sermaye yerine dışsallıklar olarak ele alır."},{"n":135,"w":"overtake","tr":"yetişip geçmek, sollamak, ele geçirmek","syn":"surpass, outstrip","ex":"Renewable energy capacity is projected to **overtake** that of fossil fuels within the next decade, marking a pivotal turning point in the global energy transition.","extr":"Yenilenebilir enerji kapasitesinin önümüzdeki on yıl içinde fosil yakıtların kapasitesini **geçmesi** bekleniyor; bu, küresel enerji geçişinde önemli bir dönüm noktasıdır."},{"n":136,"w":"penetrate","tr":"nüfuz etmek, içine işlemek, delmek","syn":"enter, permeate","ex":"The marketing campaign aims to **penetrate** the subconscious of young consumers to build brand loyalty.","extr":"Pazarlama kampanyası, genç tüketicilerin bilinçaltına **nüfuz ederek** marka sadakati oluşturmayı hedefliyor."},{"n":137,"w":"perceive","tr":"algılamak, fark etmek, idrak etmek","syn":"discern, recognize, view","ex":"How a society **perceives** risk—whether as an individual failing or a systemic issue—profoundly shapes its policy responses.","extr":"Bir toplumun riski—bireysel bir başarısızlık mı yoksa sistemsel bir sorun mu olarak—nasıl **algıladığı**, politika tepkilerini derinden şekillendirir."},{"n":138,"w":"permit","tr":"izin vermek, müsaade etmek, olanak tanımak","syn":"allow, authorize, enable","ex":"The new regulations do not **permit** companies to discharge industrial waste directly into rivers without proper treatment.","extr":"Yeni düzenlemeler, şirketlerin endüstriyel atıkları uygun arıtma yapmadan doğrudan nehirlere boşaltmasına **izin vermemektedir**."},{"n":139,"w":"perpetuate","tr":"sürekli kılmak, devam ettirmek, ebedileştirmek","syn":"sustain, continue, preserve","ex":"Traditional teaching methods sometimes **perpetuate** gender bias by presenting male and female roles in outdated ways.","extr":"Geleneksel öğretim yöntemleri, erkek ve kadın rollerini güncelliğini yitirmiş şekillerde sunarak cinsiyet önyargısını **sürdürebilir**."},{"n":140,"w":"pinpoint","tr":"tam olarak belirlemek, işaret etmek, tespit etmek","syn":"identify precisely, locate, determine exactly","ex":"While the general causes of the economic downturn are understood, economists struggle to **pinpoint** the exact moment the recession became inevitable.","extr":"Ekonomik durgunluğun genel nedenleri anlaşılsa da, ekonomistler resesyonun kaçınılmaz hale geldiği tam anı **belirlemekte** zorlanıyor."},{"n":141,"w":"postpone","tr":"ertelemek, tehir etmek","syn":"delay, defer, put off","ex":"Due to the unexpected technical failure, the research team had to **postpone** the satellite launch until next month.","extr":"Beklenmedik teknik arıza nedeniyle, araştırma ekibi uydu fırlatmasını gelecek aya **ertelemek** zorunda kaldı."},{"n":142,"w":"precede","tr":"önce gelmek, önce olmak, önceliği olmak","syn":"come before, lead up to, antecede","ex":"A period of intense social unrest often **precedes** major political transformations, acting as a catalyst for structural change.","extr":"Yoğun bir toplumsal huzursuzluk dönemi, yapısal değişim için katalizör görevi görerek, büyük siyasi dönüşümlerden genellikle **önce gelir**."},{"n":143,"w":"predict","tr":"tahmin etmek, öngörmek","syn":"forecast, anticipate, foresee","ex":"While models can **predict** the average rise in global temperatures, they are less accurate at forecasting extreme local weather events.","extr":"Modeller küresel sıcaklıklardaki ortalama artışı **tahmin edebilse** de, aşırı yerel hava olaylarını öngörmede daha az isabetlidir."},{"n":144,"w":"preserve","tr":"korumak, muhafaza etmek, saklamak","syn":"conserve, maintain, safeguard","ex":"A fundamental challenge for archivists is to **preserve** digital artifacts in formats that will remain accessible despite rapid technological obsolescence.","extr":"Arşivciler için temel bir zorluk, dijital eserleri, hızlı teknolojik eskimeye rağmen erişilebilir kalacak formatlarda **korumaktır**."},{"n":145,"w":"pretend","tr":"rol yapmak, numara yapmak, gibi davranmak","syn":"feign, simulate, affect","ex":"Nations can ill afford to **pretend** that climate change is a distant threat when its impacts are already manifesting in devastating wildfires and floods.","extr":"İklim değişikliğinin etkileri zaten yıkıcı orman yangınları ve sellerde kendini gösterirken, ulusların bunun uzak bir tehditmiş **gibi davranmaya** tahammülü yoktur."},{"n":146,"w":"prevent","tr":"önlemek, engellemek, mani olmak","syn":"stop, avert, hinder","ex":"Vaccination campaigns are the most effective public health measure to **prevent** the resurgence of infectious diseases once thought to be under control.","extr":"Aşılama kampanyaları, bir zamanlar kontrol altında olduğu düşünülen bulaşıcı hastalıkların yeniden ortaya çıkmasını **önlemek** için en etkili halk sağlığı önlemidir."},{"n":147,"w":"print","tr":"basmak, yazdırmak, iz bırakmak","syn":"publish, imprint, reproduce","ex":"The invention of the movable-type printing press did not merely **print** books; it fundamentally altered the dissemination of knowledge and the power structures of society.","extr":"Hareketli tipo baskı makinesinin icadı sadece kitap **basmadı**; bilginin yayılımını ve toplumun güç yapılarını temelden değiştirdi."},{"n":148,"w":"prioritise","tr":"öncelik vermek, önceliklendirmek","syn":"","ex":"In emergency rooms, medical staff must **prioritise** patients based on the severity of their conditions rather than arrival time.","extr":"Acil servislerde, sağlık personeli hastalara geliş saatinden ziyade durumlarının ciddiyetine göre **öncelik vermek** zorundadır."},{"n":149,"w":"prohibit","tr":"yasaklamak, men etmek, engel olmak","syn":"ban, forbid","ex":"International treaties **prohibit** the militarization of outer space, but the development of anti-satellite weapons tests the boundaries of these agreements.","extr":"Uluslararası anlaşmalar dış uzayın militarizasyonunu **yasaklar**, ancak anti-uydu silahlarının geliştirilmesi bu anlaşmaların sınırlarını zorlamaktadır."},{"n":150,"w":"prolong","tr":"uzatmak, sürmesini sağlamak","syn":"extend, lengthen, perpetuate","ex":"Palliative care aims not to **prolong** life at all costs, but to ensure the highest possible quality of life for patients with terminal illnesses.","extr":"Palyatif bakım, yaşamı her ne pahasına olursa olsun **uzatmayı** değil, terminal hastalığı olan hastalar için mümkün olan en yüksek yaşam kalitesini sağlamayı amaçlar."},{"n":151,"w":"promote","tr":"tanıtmak, terfi ettirmek, teşvik etmek","syn":"encourage, advance, foster","ex":"Public policies that actively **promote** gender equality in STEM fields are crucial for unlocking the full potential of a nation's innovative capacity.","extr":"STEM alanlarında cinsiyet eşitliğini aktif olarak **teşvik eden** kamu politikaları, bir ulusun yenilik kapasitesinin tam potansiyelini ortaya çıkarmak için çok önemlidir."},{"n":152,"w":"prove","tr":"kanıtlamak, ispat etmek, göstermek","syn":"demonstrate, verify, confirm","ex":"The experiment successfully **proved** that the new compound can kill cancer cells without damaging healthy tissue.","extr":"Deney, yeni bileşiğin sağlıklı dokuya zarar vermeden kanser hücrelerini öldürebildiğini başarıyla **kanıtladı**."},{"n":153,"w":"provide","tr":"sağlamak, temin etmek, sunmak","syn":"supply, furnish, offer","ex":"A robust social safety net is essential to **provide** a foundation of economic security, allowing citizens to take entrepreneurial risks.","extr":"Sağlam bir sosyal güvenlik ağı, vatandaşların girişimci riskler almasını sağlayacak bir ekonomik güvenlik temeli **sağlamak** için esastır."},{"n":154,"w":"provoke","tr":"kışkırtmak, tahrik etmek, yol açmak","syn":"incite, stimulate, elicit","ex":"The government's decision to cut research funding **provoked** widespread protests from the academic community.","extr":"Hükümetin araştırma fonlarını kesme kararı, akademik camiadan geniş çaplı protestolar **provokeetti**."},{"n":155,"w":"pursue","tr":"peşinden gitmek, takip etmek, sürdürmek (hedef)","syn":"follow, seek, chase","ex":"The research team decided to **pursue** a new line of investigation after their initial hypothesis failed.","extr":"Araştırma ekibi, ilk hipotezleri başarısız olduktan sonra yeni bir araştırma hattı **izlemeye** karar verdi."},{"n":156,"w":"radiate","tr":"yaymak, ışıma yapmak, etrafa saçmak","syn":"emit, emanate, diffuse","ex":"Major cultural capitals **radiate** influence, setting trends in art, fashion, and thought that are adopted worldwide.","extr":"Büyük kültür başkentleri, dünya çapında benimsenen sanat, moda ve düşünce trendlerini belirleyerek etki **yayar**."},{"n":157,"w":"raise","tr":"yükseltmek, artırmak; (soru) sormak, gündeme getirmek; (çocuk) yetiştirmek","syn":"increase, elevate; bring up","ex":"The discovery of ancient artifacts in the region **raises** profound questions about the timeline of human migration across the continent.","extr":"Bölgedeki antik eserlerin keşfi, kıtadaki insan göçünün zaman çizelgesi hakkında derin sorular **gündeme getiriyor**."},{"n":158,"w":"receive","tr":"almak, teslim almak, karşılamak","syn":"get, obtain, accept","ex":"A scientific theory only gains widespread acceptance after its findings can be independently replicated and **received** favorably by the broader academic community.","extr":"Bir bilimsel teori, bulguları bağımsız olarak tekrarlanabildikten ve daha geniş akademik topluluk tarafından olumlu **karşılandıktan** sonra yaygın kabul görür."},{"n":159,"w":"recognise","tr":"tanımak, kabul etmek, fark etmek","syn":"acknowledge, identify, admit","ex":"Psychologists **recognise** that early childhood experiences play a crucial role in shaping adult personality.","extr":"Psikologlar, erken çocukluk deneyimlerinin yetişkin kişiliğini şekillendirmede çok önemli bir rol oynadığını **kabul eder**."},{"n":160,"w":"refuse","tr":"reddetmek, geri çevirmek, kabul etmemek","syn":"decline, reject, turn down","ex":"The experimental mice **refused** to enter the brightly lit section of the maze, suggesting an aversion to intense light.","extr":"Deney fareleri, labirentin parlak ışıklandırılmış bölümüne girmeyi **reddetti**; bu, yoğun ışığa karşı bir isteksizlik olduğunu gösteriyor."},{"n":161,"w":"regulate","tr":"düzenlemek, regüle etmek, ayarlamak","syn":"control, govern, oversee","ex":"A central challenge for the 21st century is how to effectively **regulate** emergent technologies like AI and biotechnology without stifling innovation.","extr":"21. yüzyılın temel zorluklarından biri, inovasyonu engellemeden yapay zeka ve biyoteknoloji gibi yeni teknolojileri nasıl etkili bir şekilde **düzenleyeceğimizdir**."},{"n":162,"w":"reject","tr":"reddetmek, geri çevirmek, kabul etmemek","syn":"refuse, decline, turn down","ex":"The scientific community initially tends to **reject** paradigm-shifting theories, as they challenge deeply entrenched assumptions.","extr":"Bilim camiası, paradigma değiştiren teorileri başlangıçta **reddetme** eğilimindedir, çünkü bu teoriler kökleşmiş varsayımlara meydan okur."},{"n":163,"w":"release","tr":"serbest bırakmak; yayınlamak; yaymak, salmak, açığa çıkarmak","syn":"free; issue, publish; give out","ex":"Burning fossil fuels **releases** large amounts of carbon dioxide into the atmosphere.","extr":"Fosil yakıtların yakılması, atmosfere büyük miktarlarda karbondioksit **salmaktadır**."},{"n":164,"w":"relieve","tr":"rahatlatmak, hafifletmek","syn":"alleviate, ease, mitigate","ex":"The new medication helps to **relieve** symptoms of chronic pain without causing significant side effects.","extr":"Yeni ilaç, önemli yan etkilere neden olmadan kronik ağrı semptomlarını **hafifletmeye** yardımcı olur."},{"n":165,"w":"report","tr":"rapor etmek, bildirmek, haber yapmak","syn":"document, inform, announce","ex":"Several participants **reported** experiencing unusual side effects after taking the experimental drug.","extr":"Birkaç katılımcı, deneysel ilacı aldıktan sonra olağandışı yan etkiler yaşadıklarını **bildirdi**."},{"n":166,"w":"resign","tr":"istifa etmek, çekilmek, teslim olmak (kadere)","syn":"quit, step down","ex":"The minister was forced to **resign** following a scandal that eroded public trust in the government's integrity.","extr":"Bakan, hükümetin dürüstlüğüne olan kamu güvenini aşındıran bir skandalın ardından **istifa etmek** zorunda kaldı."},{"n":167,"w":"resist","tr":"direnmek, karşı koymak, dayanmak","syn":"oppose, withstand, defy","ex":"Certain bacteria have evolved mechanisms to **resist** even the most potent antibiotics, posing a grave threat to modern medicine.","extr":"Bazı bakteriler, en güçlü antibiyotiklere bile **direnç gösterecek** mekanizmalar geliştirmiştir ve bu da modern tıp için ciddi bir tehdit oluşturmaktadır."},{"n":168,"w":"resolve","tr":"çözmek, karara bağlamak, kesin karar vermek","syn":"solve, settle; determine","ex":"The peace treaty aimed to **resolve** the longstanding territorial dispute through diplomatic means rather than continued conflict.","extr":"Barış antlaşması, uzun süredir devam eden toprak anlaşmazlığını, çatışmaya devam etmek yerine diplomatik yollarla **çözmeyi** amaçlıyordu."},{"n":169,"w":"restrain","tr":"dizginlemek, sınırlamak, tutmak","syn":"curb, restrict, hold back","ex":"Central banks must carefully calibrate monetary policy to **restrain** inflation without triggering a recession.","extr":"Merkez bankaları, bir durgunluğu tetiklemeden enflasyonu **dizginlemek** için para politikasını dikkatle ayarlamalıdır."},{"n":170,"w":"retain","tr":"elinde tutmak, muhafaza etmek, akılda tutmak","syn":"keep, maintain, preserve","ex":"Despite globalization, many indigenous communities strive to **retain** their linguistic heritage and traditional knowledge systems.","extr":"Küreselleşmeye rağmen, birçok yerli topluluk dilsel miraslarını ve geleneksel bilgi sistemlerini **korumaya** çalışmaktadır."},{"n":171,"w":"retrieve","tr":"geri almak, getirmek, (bilgi) erişmek","syn":"recover, fetch, reclaim","ex":"Archaeologists use advanced imaging techniques to **retrieve** digital models of artifacts that are too fragile to be physically excavated.","extr":"Arkeologlar, fiziksel olarak çıkarılamayacak kadar kırılgan olan eserlerin dijital modellerine **erişmek** için gelişmiş görüntüleme teknikleri kullanır."},{"n":172,"w":"reverse","tr":"tersine çevirmek, geri almak, geri gitmek","syn":"overturn, undo, revert","ex":"Researchers are exploring whether certain lifestyle changes can **rev
